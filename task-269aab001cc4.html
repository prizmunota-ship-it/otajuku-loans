<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>太田 タスク管理</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1b2430; --sub:#647084; --line:#e6e9ee;
    --good:#16a34a;
    --now:#dc2626; --sale:#d97706; --plan:#2563eb; --juku:#15803d;
    --goal1:#0f172a; --goal2:#1e293b;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--sub:#94a3b8;--line:#262c36;
      --good:#22c55e;--goal1:#1e293b;--goal2:#0b1220;}
  }
  :root[data-theme="light"]{--bg:#f4f6f8;--card:#fff;--ink:#1b2430;--sub:#647084;--line:#e6e9ee;
    --good:#16a34a;--goal1:#0f172a;--goal2:#1e293b;}
  :root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--sub:#94a3b8;--line:#262c36;
    --good:#22c55e;--goal1:#1e293b;--goal2:#0b1220;}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    line-height:1.35;-webkit-text-size-adjust:100%}
  .wrap{max-width:500px;margin:0 auto;padding:12px 13px 14px}
  h1{font-size:18px;margin:0 0 9px;font-weight:800;letter-spacing:.01em}

  /* goal strip */
  .goal{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
    background:linear-gradient(135deg,var(--goal1),var(--goal2));color:#fff;
    border-radius:11px;padding:8px 12px;margin-bottom:12px;font-size:13px}
  .goal .g{opacity:.7;font-size:10px}
  .goal .chip{background:rgba(255,255,255,.13);border-radius:7px;padding:3px 9px;font-weight:700}
  .goal .chip small{font-weight:400;opacity:.82}

  /* categories */
  .cat{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:3px 15px 9px;margin-bottom:9px}
  .ch{display:flex;align-items:center;gap:8px;padding:9px 0 5px;font-size:14px;font-weight:800}
  .dot{width:9px;height:9px;border-radius:99px;flex:none}
  .cnt{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600}
  .item{display:flex;gap:11px;padding:8px 0;align-items:flex-start}
  .item+.item{border-top:1px solid var(--line)}
  .box{width:21px;height:21px;border:2px solid var(--line);border-radius:6px;flex:none;margin-top:1px;position:relative}
  .item.done .box{background:var(--good);border-color:var(--good)}
  .item.done .box::after{content:"✓";position:absolute;left:3px;top:-2px;color:#fff;font-size:14px;font-weight:800}
  .txt{font-size:15.5px;line-height:1.3}
  .item.done .txt{color:var(--sub);text-decoration:line-through}
  .sub{font-size:12px;color:var(--sub)}
  .empty{font-size:12.5px;color:var(--sub);padding:5px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>太田 タスク管理</h1>

  <div class="goal">
    <span class="g">今年</span>
    <span class="chip">5千万 <small>購入</small></span>
    <span class="chip">CF100万 <small>/月</small></span>
    <span class="chip">100室 <small>現44・残56</small></span>
  </div>

  <div id="board"></div>
</div>

<script>
  // ===== タスク（追加=1行 / 完了=done:true / 削除=行削除 / 移動=cat変更 / カテゴリ増設=CATS）=====
  const CATS = [
    { key:"plan", name:"重要だが先（計画）", note:"",       color:"var(--plan)" },
    { key:"now",  name:"目の前",            note:"",       color:"var(--now)" },
    { key:"juku", name:"太田塾",            note:"63名 ▲37", color:"var(--juku)" },
    { key:"sale", name:"売買",              note:"",       color:"var(--sale)" },
  ];
  const TASKS = [
    { cat:"plan", text:"ガス切り替え3件", sub:"八幡・久留米IC・神﨑", done:false },
    { cat:"plan", text:"法人 名称・住所変更", done:false },
    { cat:"plan", text:"宅建業申請", done:false },

    { cat:"now",  text:"三浦くん 登記簿・印鑑証明 メール提出", done:false },
    { cat:"now",  text:"阿南さん 金消時 必要資料準備", done:false },
    { cat:"now",  text:"大下さん 宿題", done:false },

    { cat:"juku", text:"ONEチーム向け勉強会 企画", sub:"城島さん", done:false },
    { cat:"juku", text:"BBQ段取り", done:false },

    { cat:"sale", text:"マイソク完成させる", done:false },
    { cat:"sale", text:"上ノ原建設 社長あいさつ", sub:"廣瀬さん同行", done:false },
  ];
  // ===== ここまでデータ =====

  const board=document.getElementById('board');
  CATS.forEach(c=>{
    const items=TASKS.filter(t=>t.cat===c.key), open=items.filter(t=>!t.done).length;
    const el=document.createElement('div');el.className='cat';
    let h=`<div class="ch"><span class="dot" style="background:${c.color}"></span>${c.name}`+
          `<span class="cnt">${c.note?c.note+' · ':''}残${open}/${items.length}</span></div>`;
    if(!items.length)h+=`<div class="empty">（なし）</div>`;
    items.forEach(t=>{h+=`<div class="item${t.done?' done':''}"><span class="box"></span>`+
      `<span class="txt">${t.text}${t.sub?`<span class="sub">（${t.sub}）</span>`:''}</span></div>`;});
    el.innerHTML=h;board.appendChild(el);
  });
</script>
</body>
</html>
