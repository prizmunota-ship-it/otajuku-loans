function fmtSize(b){ if(b>=1048576) return (b/1048576).toFixed(1)+"MB"; if(b>=1024) return Math.round(b/1024)+"KB"; return b+"B"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fileRow(f){
  if(f.path){
    return '<a class="frow" href="'+esc(f.path)+'" download="'+esc(f.name)+'">'+
      '<span class="fi">'+f.icon+'</span><span class="ft"><div class="fn">'+esc(f.name)+'</div>'+
      '<div class="fm">'+fmtSize(f.size)+'</div></span><span class="dl">⬇ 保存</span></a>';
  } else if(f.folder){
    return '<a class="frow" href="'+esc(f.drive)+'" target="_blank" rel="noopener">'+
      '<span class="fi">'+f.icon+'</span><span class="ft"><div class="fn">'+esc(f.name)+'</div>'+
      '<div class="fm"><span class="drive">ドライブのフォルダで閲覧</span></div></span>'+
      '<span class="dl ext">↗ 開く</span></a>';
  } else {
    return '<a class="frow" href="'+esc(f.drive)+'" target="_blank" rel="noopener">'+
      '<span class="fi">'+f.icon+'</span><span class="ft"><div class="fn">'+esc(f.name)+'</div>'+
      '<div class="fm">'+fmtSize(f.size)+' · <span class="drive">大容量のためドライブ</span></div></span>'+
      '<span class="dl ext">↗ 開く</span></a>';
  }
}
function groupByCat(list){
  var order=[],map={};
  list.forEach(function(x){ if(!map[x.cat]){ map[x.cat]=[]; order.push(x.cat); } map[x.cat].push(x); });
  return order.map(function(c){ return {cat:c, icon:map[c][0].catIcon, files:map[c]}; });
}
function render(q){
  q=(q||"").trim().toLowerCase().normalize("NFC");  // 入力もNFC化（濁点カナの取りこぼし防止）
  var list = q ? SHIRYO.filter(function(x){ return (x.name+" "+x.cat+" "+(x.sub||"")).toLowerCase().normalize("NFC").indexOf(q)>=0; }) : SHIRYO;
  var box=document.getElementById("body");
  if(list.length===0){ box.innerHTML='<div class="empty">該当する資料が見つかりません</div>'; return; }
  var groups=groupByCat(list), h="", op = q ? " open" : "";
  groups.forEach(function(g){
    // カテゴリー内を「直下ファイル」と「サブフォルダ別グループ」に分ける
    var direct=[], subMap={}, subOrder=[];
    g.files.forEach(function(f){
      if(f.sub){ if(!subMap[f.sub]){ subMap[f.sub]=[]; subOrder.push(f.sub); } subMap[f.sub].push(f); }
      else direct.push(f);
    });
    var inner = direct.map(fileRow).join("");
    subOrder.forEach(function(s){
      var sf=subMap[s];
      inner += '<div class="subcat'+op+'"><div class="subcat-head" onclick="this.parentNode.classList.toggle(&#39;open&#39;)">'+
        '<span class="sfi">🗂️</span><span class="scn">'+esc(s)+'</span><span class="cc">'+sf.length+'</span><span class="chev">›</span></div>'+
        '<div class="subfiles">'+sf.map(fileRow).join("")+'</div></div>';
    });
    h+='<div class="cat'+op+'"><div class="cat-head" onclick="this.parentNode.classList.toggle(&#39;open&#39;)">'+
       '<span class="ci">'+g.icon+'</span><span class="cn">'+esc(g.cat)+'</span>'+
       '<span class="cc">'+g.files.length+'</span><span class="chev">›</span></div>'+
       '<div class="files">'+inner+'</div></div>';
  });
  box.innerHTML=h;
}
render("");
document.getElementById("q").addEventListener("input",function(e){ render(e.target.value); });
