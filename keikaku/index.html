<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>年間行動計画</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="style.css"></head><body>
<div id="gate" class="gate"><div class="brand">PRIMARY <span>PLAN</span></div><h1>目標から、次の行動へ。</h1><p>総合収支アプリとつながる、1年間の行動計画。</p><p id="gateMessage">ログイン状態を確認しています…</p><form id="loginForm" class="login-form">
<label>メールアドレス<input id="loginEmail" type="email" autocomplete="username" required></label>
<label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label>
<button id="loginSubmit" class="primary" type="submit">ログインして年間計画を開く</button>
</form><p class="sub">総合収支アプリと同じメールアドレス・パスワードを使用します。</p><button id="gateReload" type="button">ログイン済みの場合は再確認</button><p class="sub"><a href="/zaikin/" target="_blank" rel="noopener">パスワードの再設定は総合収支アプリへ ↗</a></p></div>
<div id="app" hidden>
<header><div><div class="brand">PRIMARY <span>PLAN</span></div><h1>金融機関別・年間計画</h1></div><div class="toolbar"><a href="/zaikin/" target="_blank" rel="noopener">総合収支を開く ↗</a><button id="reload">最新データを取得</button><button id="manage">資金調達・支出</button><button id="saveWorksheet">保存</button><button id="print">A4で印刷</button></div></header>
<div class="statusbar"><span id="sync"></span></div>
<nav class="year-nav"><button id="previousYear">← 前年</button><strong id="selectedYear"></strong><button id="nextYear">翌年 →</button></nav><main id="readPanel"><div id="paper" class="paper"></div><section id="mobilePlan" class="mobile-plan"></section><section id="entryPanel" class="entry-panel" hidden><div class="sectionhead"><h2>資金調達案・予定支出</h2><button id="closeEntries">閉じる</button></div><p class="sub">反映をオンにした案を、その年・月の数値計画に集計します。実績の入出金ではなく計画です。</p><div class="toolbar"><button id="addEntry">＋ 案・支出を追加</button><button id="importExpenses">購入予定・支出を取り込む</button><label>CFの連動元 <select id="cfMode"><option value="registered">登録済みの年間収入</option><option value="calculated">満室賃料－返済－管理費－固都税</option></select></label></div><p id="entrySummary"></p><div id="entryList"></div></section><details id="reserveDetails" class="source-notes"></details><details id="sourceNotes" class="source-notes"></details></main></div>
<dialog id="entryDialog"><form id="entryForm"><h2>資金調達案・予定支出</h2><label>内容<input name="name" required maxlength="300"></label><label>区分<select name="kind"><option value="borrowing">資金調達（借入）</option><option value="income">資金調達（賃収・その他）</option><option value="expense">支出（工事費等・購入時）</option></select></label><label>反映月<input name="month" type="month" required></label><label>金額（万円）<input name="amount" type="number" min="0" step="0.0001" required></label><label>状況<select name="status"><option value="idea">検討案</option><option value="planned">予定</option><option value="done">実行済み</option></select></label><label><input name="include" type="checkbox">数値計画へ反映する</label><div class="toolbar"><button type="button" id="cancelEntry">キャンセル</button><button type="submit" class="primary">保存して反映</button></div></form></dialog><script type="module" src="bank-reader.mjs"></script></body></html>
