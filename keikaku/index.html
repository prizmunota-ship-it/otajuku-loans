<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>年間行動計画</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="style.css"></head><body>
<div id="gate" class="gate"><div class="brand">PRIMARY <span>PLAN</span></div><h1>目標から、次の行動へ。</h1><p>総合収支アプリとつながる、1年間の行動計画。</p><p id="gateMessage">ログイン状態を確認しています…</p><form id="loginForm" class="login-form">
<label>メールアドレス<input id="loginEmail" type="email" autocomplete="username" required></label>
<label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label>
<button id="loginSubmit" class="primary" type="submit">ログインして年間計画を開く</button>
</form><p class="sub">総合収支アプリと同じメールアドレス・パスワードを使用します。</p><button id="gateReload" type="button">ログイン済みの場合は再確認</button><p class="sub"><a href="/zaikin/" target="_blank" rel="noopener">パスワードの再設定は総合収支アプリへ ↗</a></p></div>
<div id="app" hidden>
<header><div><div class="brand">PRIMARY <span>PLAN</span></div><h1>金融機関別・年間計画</h1></div><nav class="year-nav"><button id="previousYear">← 前年</button><strong id="selectedYear"></strong><button id="nextYear">翌年 →</button></nav><div class="toolbar"><a href="/zaikin/" target="_blank" rel="noopener">総合収支を開く ↗</a><button id="reload">最新データを取得</button><button id="manage">資金調達</button><button id="saveWorksheet">保存</button><button id="print">A4で印刷</button></div></header>
<div class="statusbar"><span id="sync"></span></div>
<main id="readPanel"><div class="paper-frame"><div id="paper" class="paper"></div></div><section id="mobilePlan" class="mobile-plan"></section><section id="entryPanel" class="entry-panel"><h2>資金調達計画</h2><p id="fundingMonth" class="sub"></p><form id="entryForm"><h3 id="entryFormTitle" hidden>新しい計画</h3><label>何月<select name="month" aria-label="資金調達の月"><option value="01">1月</option><option value="02">2月</option><option value="03">3月</option><option value="04">4月</option><option value="05">5月</option><option value="06">6月</option><option value="07">7月</option><option value="08">8月</option><option value="09">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select></label><label>資金調達の内容<input name="name" required maxlength="300" placeholder="例：運転資金の借入"></label><label>金額（万円）<input name="amount" type="number" min="0" step="0.0001" required placeholder="例：300"></label><div class="toolbar"><button type="button" id="cancelEntry">クリア</button><button type="submit" class="primary">表に反映</button></div></form><div id="fundingTotals" class="funding-totals"></div><p id="entrySummary"></p><div id="entryList"></div><div hidden><button id="closeEntries"></button><button id="addEntry"></button><button id="importExpenses"></button><select id="cfMode"><option value="registered"></option><option value="calculated"></option></select></div></section><details id="reserveDetails" class="source-notes"></details><details id="sourceNotes" class="source-notes"></details></main></div>
<script type="module" src="bank-reader.mjs"></script></body></html>
