<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>太田塾 メンバーサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:linear-gradient(160deg,#FFFBEA 0%,#FFF3B0 55%,#FFE566 100%);min-height:100vh;color:#1C1400;}

/* ===== ログイン画面（融資一覧と同じ認証） ===== */
#loginOverlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#FFFBEA 0%,#FFF3B0 50%,#FFE566 100%);}
.login-box{background:#fff;border-radius:24px;padding:44px 32px 36px;max-width:360px;width:100%;text-align:center;box-shadow:0 16px 48px rgba(180,130,0,0.18),0 2px 8px rgba(180,130,0,0.08);border:1.5px solid rgba(245,196,0,0.4);}
.login-logo{font-size:48px;margin-bottom:10px;}
.login-title{font-size:24px;font-weight:900;color:#1C1400;margin-bottom:4px;letter-spacing:0.04em;}
.login-badge{display:inline-block;background:linear-gradient(135deg,#F5C400,#E8A000);color:#fff;font-size:10px;font-weight:800;padding:4px 12px;border-radius:20px;margin-bottom:18px;letter-spacing:0.12em;box-shadow:0 2px 8px rgba(232,160,0,0.35);}
.login-sub{font-size:12px;color:#7A5800;margin-bottom:24px;line-height:1.8;}
.login-input{width:100%;padding:13px 16px;background:#FFFDF5;border:1.5px solid #EDD97A;border-radius:10px;font-size:14px;font-family:inherit;color:#3D2B00;outline:none;margin-bottom:12px;transition:border-color .2s;}
.login-input::placeholder{color:#C4A862;}
.login-input:focus{border-color:#E8A000;background:#FFFBEA;}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#F5C400 0%,#E8A000 100%);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:0.08em;box-shadow:0 4px 16px rgba(232,160,0,0.4);transition:transform .15s,box-shadow .15s;}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,160,0,0.5);}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.login-msg{font-size:12px;margin-top:10px;min-height:18px;}
.login-msg.error{color:#B52020;}
.login-msg.loading{color:#A08040;}
.login-msg.success{color:#1A7A3A;font-weight:700;}

/* ===== メニュー ===== */
.wrap{max-width:480px;margin:0 auto;padding:46px 18px 60px;}
.brand{text-align:center;margin-bottom:6px;}
.brand .logo{font-size:46px;}
.brand h1{font-size:26px;font-weight:900;letter-spacing:.04em;}
.brand .badge{display:inline-block;background:linear-gradient(135deg,#F5C400,#E8A000);color:#fff;font-size:10px;font-weight:800;padding:4px 12px;border-radius:20px;margin-top:8px;letter-spacing:.12em;box-shadow:0 2px 8px rgba(232,160,0,0.35);}
.menu-title{text-align:center;font-size:13px;color:#7A5800;margin:28px 0 14px;font-weight:700;}
.app-card{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid rgba(245,196,0,.45);border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;text-decoration:none;color:inherit;box-shadow:0 6px 20px rgba(180,130,0,.10);transition:transform .12s,box-shadow .12s;}
.app-card:active{transform:scale(.985);}
.app-card .ic{font-size:30px;width:46px;text-align:center;flex-shrink:0;}
.app-card .t{flex:1;min-width:0;}
.app-card .t .nm{font-size:16px;font-weight:800;}
.app-card .t .ds{font-size:11px;color:#8A6D1F;margin-top:3px;line-height:1.5;}
.app-card .arrow{color:#E8A000;font-size:24px;font-weight:900;flex-shrink:0;}
.app-card.soon{opacity:.6;cursor:default;border-style:dashed;box-shadow:none;background:#FFFDF3;}
.logout{display:block;margin:24px auto 0;font-size:11px;color:#9A8030;background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;}
.foot{text-align:center;font-size:10px;color:#A89050;margin-top:18px;}
</style>
</head>
<body>

<!-- ログイン（メンバー照合） -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">🏠</div>
    <div class="login-title">太田塾</div>
    <div class="login-badge">㊙️ MEMBERS ONLY</div>
    <div class="login-sub">入会時アンケートに登録頂いた<br>Gmailアドレスを入力してください。</div>
    <input type="email" id="loginEmail" class="login-input" placeholder="example@gmail.com" autocomplete="email">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">ログイン</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<!-- メニュー -->
<div class="wrap">
  <div class="brand">
    <div class="logo">🏠</div>
    <h1>太田塾</h1>
    <div><span class="badge">㊙️ MEMBERS ONLY</span></div>
  </div>
  <div class="menu-title">利用するメニューを選んでください</div>

  <a class="app-card" href="loans.html">
    <div class="ic">🏦</div>
    <div class="t"><div class="nm">金融機関 融資情報一覧</div><div class="ds">福岡・九州の金融機関の融資条件・実績まとめ</div></div>
    <div class="arrow">›</div>
  </a>

  <a class="app-card" href="jigyo.html">
    <div class="ic">📄</div>
    <div class="t"><div class="nm">事業計画書</div><div class="ds">物件情報を入れて事業計画書を作成・A4 PDF出力</div></div>
    <div class="arrow">›</div>
  </a>

  <div class="app-card soon">
    <div class="ic">➕</div>
    <div class="t"><div class="nm">今後追加予定</div><div class="ds">新しいツールを順次追加していきます</div></div>
  </div>

  <button class="logout" onclick="logout()">別のメールアドレスでログインし直す</button>
  <div class="foot">© 太田塾 メンバー専用</div>
</div>

<script>
// ===== メンバー認証（融資一覧と同じGAS照合・localStorage共有） =====
var GAS_URL = "https://script.google.com/macros/s/AKfycbyZAnDfRVkEsGmaEmZoXQixgMyVHmlMJ-6aMQ4M7Pr_8_q8NwrfAna6tH-eAlYd8uwL/exec";

// 認証済みなら入口を閉じてメニュー表示。ただし毎回「在籍」を再確認（退会者を締め出すため）
if(localStorage.getItem("otajuku_auth") === "ok" && localStorage.getItem("otajuku_email")){
  document.getElementById("loginOverlay").style.display = "none";
  revalidate();
} else {
  localStorage.removeItem("otajuku_auth");   // 旧セッション(メール未保存)は再ログインさせる
}
// 在籍の再確認：登録から外れていたら強制ログアウト
function revalidate(){
  var em = localStorage.getItem("otajuku_email"); if(!em) return;
  window._recheck = function(r){
    if(r !== "ok"){
      localStorage.removeItem("otajuku_auth"); localStorage.removeItem("otajuku_email");
      var ov=document.getElementById("loginOverlay"); ov.style.display="flex";
      var m=document.getElementById("loginMsg"); m.className="login-msg error"; m.textContent="登録が確認できませんでした。再度ログインしてください。";
    }
  };
  var s=document.createElement("script");
  s.src = GAS_URL + "?email=" + encodeURIComponent(em) + "&callback=_recheck";
  document.body.appendChild(s);
}

function doLogin(){
  var email = document.getElementById("loginEmail").value.trim();
  var msg = document.getElementById("loginMsg");
  var btn = document.getElementById("loginBtn");
  if(!email || !email.includes("@")){
    msg.className="login-msg error";
    msg.textContent="正しいメールアドレスを入力してください";
    return;
  }
  btn.disabled = true;
  msg.className="login-msg loading";
  msg.textContent="確認中...";
  var script = document.createElement("script");
  window._loginCallback = function(result){
    if(document.body.contains(script)) document.body.removeChild(script);
    if(result === "ok"){
      localStorage.setItem("otajuku_auth", "ok");
      localStorage.setItem("otajuku_email", email.toLowerCase());
      msg.className="login-msg success";
      msg.textContent="認証成功！";
      setTimeout(function(){ document.getElementById("loginOverlay").style.display="none"; }, 500);
    } else {
      msg.className="login-msg error";
      msg.textContent="このメールアドレスは登録されていません。太田までご連絡ください。";
      btn.disabled = false;
    }
  };
  script.src = GAS_URL + "?email=" + encodeURIComponent(email) + "&callback=_loginCallback";
  document.body.appendChild(script);
}
function logout(){ localStorage.removeItem("otajuku_auth"); localStorage.removeItem("otajuku_email"); location.reload(); }
document.getElementById("loginEmail").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
</script>
</body>
</html>
