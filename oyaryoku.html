<style>

.b-gas{ background:#FFEBE0; color:#C0561A; } .b-hoken{ background:#E4F1FF; color:#1667B8; } .b-creka{ background:#EDE6FF; color:#6B44C4; } .b-fuku{ background:#E4F7E9; color:#1E8A46; } .b-zei{ background:#FFF1D9; color:#B07408; }

var CATS = [

var DATA = [
{cat:"gas", date:"2025/04/27", title:"TOKAI（全国対応の給湯器・無償貸与）", sub:"給湯器フルメンテ＋切替5万/戸＋毎月300〜500円/戸が大家に入る", body:`
<p>ガス会社が給湯器を<b>フルメンテナンス</b>してくれ、さらに切替時と毎月の手数料が大家に入るスキーム。</p>
<ul>
<li>切替時：<b>5万円/戸</b>の手数料</li>
<li>毎月：<b>300〜500円/戸</b>程度の手数料</li>
</ul>
<div class="note">ガス会社と<b>管理会社</b>が契約し、管理会社経由で大家に入る形。＝管理会社の協力が必要。太田は2物件で切替段取り中。</div>
<p>公式：<a href="https://www.lpg.tokai.jp" target="_blank" rel="noopener">https://www.lpg.tokai.jp</a>（多分全国対応）</p>`},

{cat:"gas", date:"2025/04/27", title:"榊ガス（福岡エリア）", sub:"給湯器＋2口グリル付きビルトインコンロを貸与", body:`
<p>エリアは<b>福岡</b>で絞られるが、<b>給湯器＋2口グリル付きのビルトインタイプ</b>を貸与してくれた（切替済み）。</p>
<p>公式：<a href="https://gasuyanomadoguchi.com/gclist/fukuoka_438/" target="_blank" rel="noopener">ガス屋の窓口（福岡）</a></p>`},

{cat:"hoken", date:"2025/04/28", title:"少額短期保険で手数料を得る（大家が代理店になる）", sub:"入居者の家財保険の手数料40%前後をオーナーが受け取る小銭チャリンスキーム", body:`
<p>入居者が加入する家財保険の手数料の受取人を、通常の「保険会社」or「保険会社＋管理会社で折半」から、<b>オーナー（40%前後）＋保険会社（60%前後）</b>に変える。小規模から可能で、オーナーがやるのは<b>申込書作成（2〜3分）</b>くらい。</p>
<div class="note">管理会社が保証会社とのセット契約等でこの手数料をあてにしている場合もあるので、<b>管理会社の状況を必ず確認</b>してから相談を。</div>
<h4>やり方（手順）</h4>
<ul>
<li>①少額短期保険募集人の<b>資格を取得</b>（<a href="https://www.shougakutanki.jp/exam/exam_cbt.html" target="_blank" rel="noopener">試験情報</a>）</li>
<li>②少短会社に<b>代理店登録</b>したい旨連絡（太田は<b>東日本少額短期保険（株）</b>と取引。必要なら太田が繋ぎます）</li>
<li>③保険会社で登録手続き（1ヶ月程度）</li>
<li>④保険利用開始</li>
<li>⑤管理会社に代理店登録を伝え、今後は自身の保険を使わせてもらう旨相談</li>
<li>⑥賃貸契約時に、管理会社から必要情報をもらい申込書を作成</li>
<li>⑦申込書を管理会社へ提出→契約前（必ず鍵渡し前）に渡してもらう</li>
<li>⑧保険金の入金確認後に鍵渡し（※入金確認後の鍵渡しを管理会社と整合しておく）</li>
</ul>`},

{cat:"hoken", date:"2025/08", title:"火災・地震保険の請求ノウハウ", sub:"保険金はフルマックス／一部損の取り方／請求が通る切り口", body:`
<h4>保険金はフルマックスでかける</h4>
<p>購入金額以上にかける発想を持つ。地震リスクが高いと思うエリアは、オーナー側で保険金額を操作する。</p>
<h4>地震保険（現地鑑定人立会の実例）</h4>
<ul>
<li><b>壁式RC・ハウスメーカーの軽量鉄骨</b>は一部損にするのがかなり難しい。<b>ラーメン構造</b>だとまだ良い。</li>
<li>鑑定人：<b>（株）三立鑑定 深見敏朗さん</b>＝現地で一部損を確定してくれる（基礎・外壁のヒビ等）。太田は木造で一部損 約100万の実績（フルマックス付保）。</li>
</ul>
<h4>火災保険請求の"切り口"</h4>
<div class="note">近年、鑑定人の現地確認が増加。「軒天破損→上段排水オーバーフローで浸水」の建付けは、<b>防水切れが理由でNG</b>にされやすい。</div>
<ul>
<li>有効な切り口（岡さん）：<b>排水管（軒天内を通る管）の接続部から水漏れ→軒天が濡れた</b>。これなら水漏れ原因を問わない（劣化でもOK）で対象になりやすい（認定 約15万前後の例）。</li>
</ul>`},

{cat:"creka", date:"2025/09", title:"固定資産税・税金をクレカ払い→ポイント/マイル化", sub:"eltaxでクレカ払い。高還元カードなら手数料負けせず『むしろお得』", body:`
<p>税金は現金でなく<b>クレジットカード払い</b>でポイント/マイルが貯まる。手数料はかかるが、還元率の高いカードなら手数料負けせず得。</p>
<p>支払サイト：<a href="https://www.payment.eltax.lta.go.jp/pbuser" target="_blank" rel="noopener">地方税お支払サイト（eltax）</a></p>
<div class="note">実例：<b>ANA VISAプラチナ（1.5%）</b>で 748,000円の支払い→手数料6,145円だが <b>11,220 ANAマイル</b>が付与。福岡⇔羽田は7,500マイル（航空券なら25,000円前後）＝手数料を上回るお得。</div>
<h4>おすすめカード（太田周辺で使用者多い）</h4>
<ul>
<li><b>マリオットボンボイ・アメックス</b>：年会費49,500円（宿泊1回無料≒実質無料）／マイル最大1.25%（6万pt毎に1.5万ボーナス）。<span style="color:#B52020">※税金支払は還元率が半分になる点に注意</span></li>
<li><b>ANA VISAプラチナ</b>：年会費88,000円／マイル1.5%（年600万以上決済向け、税金も還元率そのまま）</li>
<li>年会費が安い順：ANA VISA一般（初年度無料/2年目2,200円）→ANA VISAゴールド（15,400円）もおすすめ</li>
</ul>
<div class="contact">ANA VISA は<b>紹介で入会するとポイント</b>が付きます。太田が紹介可（紹介番号 <b>00125434</b>／オオタ ケイイチ）。ご連絡ください。</div>`},

{cat:"fuku", date:"2025/08", title:"自販機設置（売上の25%前後が大家収入）", sub:"アサヒ／伊藤園／ワールドサンフーズ／サンエイ／ネオス", body:`
<p>敷地に自販機を置き、売上の一部（<b>25%前後</b>）が大家に入る副収入。エリアや設置条件は各社次第（近年はコスト高で設置が厳しめの会社も）。</p>
<div class="contact"><b>アサヒ飲料</b>：藤本さん <a href="tel:08027910391">080-2791-0391</a>（太田から紹介可・条件は現地確認後・過去 売上25%の実績）／経営企画部 丹野さん</div>
<div class="contact"><b>伊藤園</b>：売上25%（エリアで変動）・対応エリア制限なし・最近はコスト高で設置が厳しくなってきている</div>
<div class="contact"><b>ワールドサンフーズ</b>：牧島さん <a href="tel:08039085635">080-3908-5635</a>（太田から紹介可・前ほど積極的でないが売上25%実績・<b>福岡市内</b>重要）</div>
<div class="contact"><b>サンエイ自販機（100円飲料）</b>：古賀さん <a href="tel:08046443156">080-4644-3156</a>（福岡市中心）</div>
<div class="contact"><b>ネオス</b>：担当 <a href="tel:09060816331">090-6081-6331</a></div>`},

{cat:"fuku", date:"2025/08/11", title:"バイク駐輪スペース賃貸（遊休地の副収入）", sub:"パーキングマーケット", body:`
<p>不動産の<b>遊休地にバイク駐輪スペース</b>を貸し出し（大家→同社へ賃貸）、副収入を得る。</p>
<div class="contact"><b>パーキングマーケット</b>：矢越（やごし）さん <a href="tel:08080014576">080-8001-4576</a></div>`},

{cat:"zei", date:"2025/06/17", title:"不動産取得税の支払いを『先延ばし』（回転差資金の確保）", sub:"「お知らせ」段階なら未納・遅延にならず期日変更できる", body:`
<p>不動産購入後、だいたい<b>半年後</b>に不動産取得税の納付書が届く。高額（概ね3,000万以上）だと納付書の前に「<b>お知らせ</b>」という紙が届く。</p>
<div class="note">この<b>お知らせの段階なら</b>、もっともらしい理由で支払期日を後ろ倒しにしても<b>未納・遅延にならない</b>（信用情報に響かない）。太田は毎回これで支払いを遅らせて回転差資金を確保（例：7月末→11月末に変更してもらった実績）。</div>
<ul>
<li>⚠️ <b>納付書が届いてから</b>の期日変更はできない。この期日に払わないと未納（遅延）に。</li>
<li>⚠️ 分割は<b>遅延扱い</b>になるので、滞納なし証明が要る不動産購入中は非推奨。</li>
</ul>
<p>不動産拡大中はとにかく資金が必要＝<b>回転差資金</b>を重視。</p>`}
];

var curCat="all", curQ="";

function chipsHTML(){
  return CATS.map(function(c){
    return '<button class="chip'+(c.key===curCat?' active':'')+'" data-cat="'+c.key+'">'+c.label+'</button>';
  }).join("");
}
function cardHTML(d,i){
  var cm=CATMAP[d.cat];
  return '<div class="card" id="oc'+i+'"><div class="card-head" onclick="tg('+i+')">'+
    '<span class="cat-badge '+cm.cls+'">'+cm.name+'</span>'+
    '<div class="cta"><div class="c-title">'+d.title+'</div><div class="c-sub">'+d.sub+'</div></div>'+
    '<div class="c-meta">'+(d.date?'<span class="c-date">📅 '+d.date+'</span>':'')+'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></div>'+
    '</div><div class="card-body"><div class="body-inner">'+d.body+'</div></div></div>';
}
function tg(i){ document.getElementById("oc"+i).classList.toggle("open"); }
function render(){
  document.getElementById("chips").innerHTML=chipsHTML();
  document.querySelectorAll(".chip").forEach(function(b){
    b.addEventListener("click",function(){ curCat=b.getAttribute("data-cat"); render(); });
  });
  var list=DATA.filter(function(d){
    var okc=(curCat==="all"||d.cat===curCat);
    var okq=(!curQ|| (d.title+d.sub+d.body).toLowerCase().indexOf(curQ.toLowerCase())>=0);
    return okc&&okq;
  });
  var box=document.getElementById("cardList");
  box.innerHTML = list.length? list.map(function(d){return cardHTML(d,DATA.indexOf(d));}).join("") : '<div class="empty">該当する情報が見つかりません</div>';
  document.getElementById("countLabel").textContent=list.length+"件";
}
document.getElementById("searchInput").addEventListener("input",function(e){ curQ=e.target.value; render(); });
render();

// ===== 認証 =====
if(localStorage.getItem("otajuku_auth")==="ok"){ document.getElementById("loginOverlay").style.display="none"; }
function doLogin(){
  var email=document.getElementById("loginEmail").value.trim();
  var msg=document.getElementById("loginMsg"), btn=document.getElementById("loginBtn");
  if(!email||!email.includes("@")){ msg.className="login-msg error"; msg.textContent="正しいメールアドレスを入力してください"; return; }
  btn.disabled=true; msg.className="login-msg loading"; msg.textContent="確認中...";
  var script=document.createElement("script");
  window._loginCallback=function(result){
    if(document.body.contains(script)) document.body.removeChild(script);
    if(result==="ok"){
      localStorage.setItem("otajuku_auth","ok"); localStorage.setItem("otajuku_email",email.toLowerCase());
      msg.className="login-msg success"; msg.textContent="認証成功！";
      setTimeout(function(){ document.getElementById("loginOverlay").style.display="none"; },600);
    } else { msg.className="login-msg error"; msg.textContent="このメールアドレスは登録されていません。太田までご連絡ください。"; btn.disabled=false; }
  };
  script.src=GAS_URL+"?email="+encodeURIComponent(email)+"&callback=_loginCallback";
  document.body.appendChild(script);
}
document.getElementById("loginEmail").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
</script>
