<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太田塾 物件分析レポート</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#1f2937;background:#f8fafc;font-size:13px;line-height:1.55;}
.wrap{max-width:940px;margin:0 auto;padding:18px 14px 70px;}
.appbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.appbar .lg{font-size:18px;font-weight:800;color:#0f766e;letter-spacing:1px;}
.appbar .tg{font-size:11px;color:#6b7280;}
.form{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:18px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;}
.fld label{display:block;font-size:11px;font-weight:700;color:#6b7280;margin-bottom:3px;}
.fld input,.fld select{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff;}
.fld input:focus,.fld select:focus{outline:none;border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.15);}
.fld .u{font-size:10px;color:#9ca3af;}
.span2{grid-column:span 2;}
.actions{display:flex;align-items:center;gap:10px;margin-top:14px;}
.btn{background:#0f766e;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:800;cursor:pointer;}
.btn:hover{background:#0d5f58;}
.btn.sec{background:#334155;}
.hint{font-size:10.5px;color:#9ca3af;margin-top:10px;}
.assump{margin-top:12px;padding-top:12px;border-top:1px dashed #e5e7eb;}
.assump .grid{grid-template-columns:repeat(4,1fr);}
.assump .tt{font-size:11px;font-weight:800;color:#0f766e;margin-bottom:8px;}

#report{display:none;}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0f766e;padding-bottom:9px;margin-bottom:14px;}
.hd .ttl{font-size:21px;font-weight:800;color:#0f766e;letter-spacing:1px;}
.hd .sub{font-size:11px;color:#6b7280;margin-top:3px;}
.hd .brand{text-align:right;font-size:10px;color:#6b7280;}
.hd .brand b{font-size:13px;color:#0f766e;display:block;letter-spacing:2px;}
.propbar{background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
.propbar .nm{font-size:15px;font-weight:800;color:#0f766e;}
.propbar .ad{font-size:12px;color:#374151;}
.propbar .spec{font-size:10.5px;color:#6b7280;margin-left:auto;text-align:right;}
.sec-h{font-size:13.5px;font-weight:800;color:#0f766e;margin:18px 0 9px;padding-left:9px;border-left:5px solid #14b8a6;}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:4px;}
.kpi .t{border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;}
.kpi .t.hl{background:#f0fdfa;border-color:#5eead4;}
.kpi .t .l{font-size:10.5px;color:#6b7280;font-weight:700;}
.kpi .t .v{font-size:22px;font-weight:800;color:#0f766e;margin-top:2px;}
.kpi .t .v small{font-size:11px;color:#6b7280;font-weight:600;}
.kpi .t .s{font-size:10px;color:#9ca3af;margin-top:2px;}
table.calc{width:100%;border-collapse:collapse;margin-top:6px;}
table.calc th{background:#eef4fb;font-size:11px;text-align:left;padding:7px 10px;font-weight:700;border:1px solid #e5e7eb;}
table.calc td{font-size:12px;padding:7px 10px;border:1px solid #eef2f2;}
table.calc td.r{text-align:right;font-weight:700;}
table.calc td.k{color:#6b7280;}
table.calc tr.sum td{background:#f0fdfa;font-weight:800;font-size:13px;}
.formula{font-size:10px;color:#9ca3af;margin-top:4px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.verdict{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 15px;font-size:12px;line-height:1.7;color:#78350f;margin-top:6px;}
.verdict b{color:#0f766e;}
.phase{background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:8px;padding:10px 13px;font-size:11px;color:#64748b;margin-top:6px;}
.foot{margin-top:14px;font-size:9px;color:#9ca3af;line-height:1.5;border-top:1px solid #e5e7eb;padding-top:7px;}
@media print{body{background:#fff;}.appbar,.form,.toolbar{display:none!important;}.wrap{padding:0;max-width:none;}.card{border:none;box-shadow:none;padding:0;}}
.toolbar{display:none;margin-bottom:12px;}
</style></head><body>
<div class="wrap">
  <div class="appbar"><div class="lg">🌻 太田塾</div><div class="tg">物件分析レポート（金融機関提出フォーマット）</div></div>

  <div class="form">
    <div class="grid">
      <div class="fld span2"><label>物件名</label><input id="pname" placeholder="例：太田塾ハイツ"></div>
      <div class="fld span2"><label>住所</label><input id="paddr" placeholder="例：福岡県筑後市羽犬塚…"></div>
      <div class="fld"><label>物件種別</label><select id="ptype"><option>一棟マンション</option><option>一棟アパート</option><option>一棟ビル</option></select></div>
      <div class="fld"><label>構造</label><select id="pstruct">
        <option value="wood">木造</option><option value="lgs">軽量鉄骨造</option>
        <option value="steel">鉄骨造</option><option value="rc" selected>RC</option><option value="src">SRC</option>
      </select></div>
      <div class="fld"><label>築年数 <span class="u">年</span></label><input id="page" type="number" value="0"></div>
      <div class="fld"><label>想定年収入 <span class="u">円/年（満室想定）</span></label><input id="pincome" type="number" placeholder="例：6000000"></div>
      <div class="fld"><label>土地面積 <span class="u">㎡</span></label><input id="pland" type="number" placeholder="例：200"></div>
      <div class="fld"><label>建物延床面積 <span class="u">㎡</span></label><input id="pbldg" type="number" placeholder="例：300"></div>
      <div class="fld"><label>土地単価 <span class="u">円/㎡（路線価/公示）</span></label><input id="plandprice" type="number" placeholder="例：80000"></div>
      <div class="fld"><label>想定/売出価格 <span class="u">円（任意）</span></label><input id="paskprice" type="number" placeholder="例：85000000"></div>
    </div>

    <div class="assump">
      <div class="tt">▼ 評価前提（必要に応じて調整）</div>
      <div class="grid">
        <div class="fld"><label>還元利回り（キャップ） <span class="u">%</span></label><input id="acap" type="number" step="0.1" value="8.0"></div>
        <div class="fld"><label>運営経費率 <span class="u">%（対収入）</span></label><input id="aexp" type="number" step="1" value="20"></div>
        <div class="fld"><label>建物 再調達単価 <span class="u">円/㎡（空=構造標準）</span></label><input id="arebuild" type="number" placeholder="自動"></div>
        <div class="fld"><label>法定耐用年数 <span class="u">年（空=構造標準）</span></label><input id="ausef" type="number" placeholder="自動"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" onclick="gen()">レポート作成</button>
      <span class="hint" style="margin:0">※①マーケット（収益評価・積算評価）を算出します。周辺・統計・ハザードは統合予定。</span>
    </div>
  </div>

  <div class="toolbar" id="toolbar"><button class="btn sec" onclick="window.print()">🖨 PDFで保存 / 印刷</button></div>
  <div id="report"></div>
</div>

<script>
const STRUCT={
  wood:{name:"木造",rebuild:150000,useful:22},
  lgs:{name:"軽量鉄骨造",rebuild:150000,useful:27},
  steel:{name:"鉄骨造",rebuild:180000,useful:34},
  rc:{name:"RC",rebuild:200000,useful:47},
  src:{name:"SRC",rebuild:200000,useful:47},
};
const yen=n=>"¥"+Math.round(n).toLocaleString('ja-JP');
const man=n=>(n/10000).toLocaleString('ja-JP',{maximumFractionDigits:0})+"万円";
const num=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;};
const val=id=>document.getElementById(id).value;

function gen(){
  const pname=val('pname')||'（物件名未入力）', paddr=val('paddr')||'—';
  const ptype=val('ptype'), sk=val('pstruct'), st=STRUCT[sk];
  const age=num('page'), income=num('pincome'), land=num('pland'), bldg=num('pbldg');
  const landPrice=num('plandprice'), ask=num('paskprice');
  const cap=num('acap')||8, expRate=num('aexp');
  const rebuild=num('arebuild')||st.rebuild, useful=num('ausef')||st.useful;

  // ① 収益評価（収益還元法）
  const gpi=income;
  const noi=gpi*(1-expRate/100);
  const shuekiPrice = cap>0 ? noi/(cap/100) : 0;
  const surfaceYield = shuekiPrice>0 ? gpi/shuekiPrice*100 : 0;

  // ① 積算評価（積算法）
  const landVal=landPrice*land;
  const remain=Math.max(useful-age,0);
  const bldgRebuild=rebuild*bldg;
  const bldgVal=useful>0?bldgRebuild*(remain/useful):0;
  const sekisanPrice=landVal+bldgVal;

  // 取得価格ベース（任意）
  let askBlock='';
  if(ask>0){
    const askYield=gpi/ask*100;
    const vsShueki=shuekiPrice>0?(ask/shuekiPrice*100):0;
    const vsSekisan=sekisanPrice>0?(ask/sekisanPrice*100):0;
    askBlock=`<div class="sec-h">💰 想定/売出価格との比較</div>
    <div class="kpi">
      <div class="t"><div class="l">想定/売出価格</div><div class="v">${man(ask)}</div><div class="s">${yen(ask)}</div></div>
      <div class="t hl"><div class="l">表面利回り（取得価格ベース）</div><div class="v">${askYield.toFixed(2)}<small>%</small></div><div class="s">満室想定収入 ÷ 価格</div></div>
      <div class="t"><div class="l">対 収益価格 / 対 積算価格</div><div class="v" style="font-size:16px">${vsShueki.toFixed(0)}% / ${vsSekisan.toFixed(0)}%</div><div class="s">100%未満＝割安の目安</div></div>
    </div>`;
  }

  const today=new Date();const dstr=today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日';
  const html=`<div class="card">
    <div class="hd">
      <div><div class="ttl">物件分析レポート</div><div class="sub">収益評価・積算評価（金融機関提出フォーマット）</div></div>
      <div class="brand"><b>太田塾</b>物件分析<br>発行日 ${dstr}</div>
    </div>
    <div class="propbar">
      <div><div class="nm">${pname}</div><div class="ad">${paddr}</div></div>
      <div class="spec">${ptype}／${st.name}／築${age}年<br>土地${land||'—'}㎡・建物${bldg||'—'}㎡</div>
    </div>

    <div class="sec-h">① 収益評価（収益還元法）</div>
    <div class="kpi">
      <div class="t"><div class="l">満室想定年収入（GPI）</div><div class="v" style="font-size:18px">${man(gpi)}</div><div class="s">${yen(gpi)}</div></div>
      <div class="t"><div class="l">運営純収益（NOI）</div><div class="v" style="font-size:18px">${man(noi)}</div><div class="s">経費率${expRate}%控除後</div></div>
      <div class="t hl"><div class="l">収益価格</div><div class="v">${man(shuekiPrice)}</div><div class="s">NOI ÷ 還元利回り${cap}%</div></div>
    </div>
    <table class="calc">
      <tr><td class="k">満室想定年収入（GPI）</td><td class="r">${yen(gpi)}</td></tr>
      <tr><td class="k">△ 運営経費（${expRate}%）</td><td class="r">− ${yen(gpi*expRate/100)}</td></tr>
      <tr><td class="k">運営純収益（NOI）</td><td class="r">${yen(noi)}</td></tr>
      <tr><td class="k">還元利回り（キャップレート）</td><td class="r">${cap.toFixed(1)}%</td></tr>
      <tr class="sum"><td>収益価格（NOI ÷ 還元利回り）</td><td class="r">${yen(shuekiPrice)}</td></tr>
    </table>
    <div class="formula">想定表面利回り（対収益価格）= ${surfaceYield.toFixed(2)}%</div>

    <div class="sec-h">② 積算評価（積算法）</div>
    <table class="calc">
      <tr><th>区分</th><th>算式</th><th style="text-align:right">評価額</th></tr>
      <tr><td class="k">土地</td><td class="k">${yen(landPrice)}/㎡ × ${land||0}㎡</td><td class="r">${yen(landVal)}</td></tr>
      <tr><td class="k">建物（再調達）</td><td class="k">${yen(rebuild)}/㎡ × ${bldg||0}㎡</td><td class="r">${yen(bldgRebuild)}</td></tr>
      <tr><td class="k">建物（残存評価）</td><td class="k">再調達 × 残存${remain}年 / 耐用${useful}年</td><td class="r">${yen(bldgVal)}</td></tr>
      <tr class="sum"><td colspan="2">積算価格（土地 ＋ 建物残存）</td><td class="r">${yen(sekisanPrice)}</td></tr>
    </table>
    <div class="formula">${landPrice<=0?'⚠️ 土地単価が未入力です。路線価/公示地価を入力すると土地評価が計算されます（Phase2でreinfolib自動取得予定）。':'土地単価は路線価/公示地価の入力値を使用。'}</div>

    <div class="sec-h">③ 総合評価</div>
    <div class="kpi">
      <div class="t hl"><div class="l">収益価格</div><div class="v">${man(shuekiPrice)}</div></div>
      <div class="t hl"><div class="l">積算価格</div><div class="v">${man(sekisanPrice)}</div></div>
      <div class="t"><div class="l">収益 ÷ 積算</div><div class="v">${sekisanPrice>0?(shuekiPrice/sekisanPrice*100).toFixed(0):'—'}<small>%</small></div><div class="s">収益と積算の関係</div></div>
    </div>
    ${askBlock}

    <div class="sec-h">④ 参考データ（Phase2で自動取得）</div>
    <div class="phase">🔧 <b>類似取引事例・地価公示・地価調査・用途地域</b>＝reinfolib（国交省 不動産情報ライブラリ）連携で自動取得予定。<br>🔧 <b>周辺環境・統計・ハザード10種</b>＝周辺環境アプリ（GSI/OSM/J-SHIS）を統合予定。</div>

    <div class="foot">
      ※本レポートは入力値と一般的な評価手法（収益還元法・積算法）に基づく試算です。還元利回り・経費率・再調達単価・耐用年数は標準値または入力値を用いており、実際の金融機関評価・市場価格を保証するものではありません。金融機関提出時は路線価・取引事例等の裏付資料を添付してください。／ 太田塾 物件分析レポート（β）
    </div>
  </div>`;
  document.getElementById('report').innerHTML=html;
  document.getElementById('report').style.display='block';
  document.getElementById('toolbar').style.display='block';
}
</script>
</body></html>
