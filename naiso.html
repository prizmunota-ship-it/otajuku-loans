<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>内装管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:#F5F4F0;color:#1a1a1a;min-height:100vh;}

.top-bar{background:#fff;border-bottom:1px solid #E8E6E0;padding:12px 16px;position:sticky;top:0;z-index:100;}
.top-bar h1{font-size:17px;font-weight:700;letter-spacing:-0.3px;}
.top-bar p{font-size:11px;color:#888;margin-top:1px;}

.user-row{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #E8E6E0;}
.user-row::-webkit-scrollbar{display:none;}
.ubtn{flex-shrink:0;border:1.5px solid #DDD;background:#fff;border-radius:24px;padding:6px 14px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;color:#666;font-weight:500;}
.ubtn.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff;}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border-bottom:1px solid #E8E6E0;}
.sbox{padding:10px 0;text-align:center;border-right:1px solid #E8E6E0;}
.sbox:last-child{border-right:none;}
.sval{font-size:22px;font-weight:700;}
.slbl{font-size:10px;color:#888;margin-top:1px;}
.s-naiso .sval{color:#C07000;}
.s-mi .sval{color:#5040B0;}
.s-yotei .sval{color:#1060C0;}
.s-done .sval{color:#1A7040;}

.filters{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:#F5F4F0;}
.filters::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;border:1.5px solid #DDD;background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;color:#666;}
.chip.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff;}

.cards{padding:10px 12px 100px;display:flex;flex-direction:column;gap:8px;}

.card{background:#fff;border:1px solid #E8E6E0;border-radius:14px;padding:14px;transition:transform 0.1s;}
.card:active{transform:scale(0.985);}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-name{font-size:15px;font-weight:700;}
.card-room{font-size:12px;color:#888;margin-top:2px;}

.badge{font-size:15px;font-weight:700;padding:7px 16px;border-radius:20px;flex-shrink:0;margin-left:8px;letter-spacing:0.3px;border:2px solid transparent;}
.b-naiso{background:#FFE0A8;color:#7A4400;border-color:#E0A030;}
.b-mi{background:#E2DBFF;color:#2E2080;border-color:#7A68D8;}
.b-done{background:#CDEED9;color:#0E5030;border-color:#3A9060;}
.b-yotei{background:#CFE2FF;color:#063A80;border-color:#3A80D8;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-bottom:10px;}
.info-item{}
.info-lbl{font-size:10px;color:#999;}
.info-val{font-size:13px;font-weight:500;margin-top:1px;}

.note-box{background:#F8F7F3;border-radius:8px;padding:8px 10px;font-size:12px;color:#666;margin-bottom:10px;}

.actions{display:flex;gap:6px;padding-top:10px;border-top:1px solid #F0EEE8;}
.abtn{flex:1;border:1.5px solid #DDD;background:#F8F7F3;border-radius:10px;padding:9px;font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;color:#333;font-weight:500;}
.abtn.primary{background:#1a1a1a;border-color:#1a1a1a;color:#fff;}

.loading{text-align:center;padding:60px 20px;color:#888;font-size:14px;}
.loading .spin{display:inline-block;width:24px;height:24px;border:2px solid #DDD;border-top-color:#888;border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.4);align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:0 0 40px;}
.modal-handle-area{padding:12px;text-align:center;cursor:pointer;}
.modal-handle{width:36px;height:4px;background:#DDD;border-radius:2px;display:inline-block;}
.modal-inner{padding:0 16px;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12px;color:#888;margin-bottom:20px;}

.fgroup{margin-bottom:16px;}
.flabel{font-size:11px;color:#888;margin-bottom:5px;font-weight:500;}
.req{color:#E04040;margin-left:2px;}
.fval{width:100%;padding:11px 13px;border:1.5px solid #DDD;border-radius:10px;font-size:15px;font-family:'Noto Sans JP',sans-serif;background:#fff;color:#1a1a1a;outline:none;}
.fval:focus{border-color:#1a1a1a;}
textarea.fval{resize:vertical;min-height:80px;}

.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.s-option{border:2px solid #DDD;border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;font-size:16px;font-weight:700;font-family:'Noto Sans JP',sans-serif;background:#fff;color:#555;}
.s-option.sel{border-color:#1a1a1a;background:#1a1a1a;color:#fff;}

.mbtn-row{display:flex;gap:8px;margin-top:20px;}
.mbtn{flex:1;padding:13px;border-radius:12px;font-size:15px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;border:1.5px solid #DDD;background:#F8F7F3;color:#333;font-weight:500;}
.mbtn.save{background:#1a1a1a;border-color:#1a1a1a;color:#fff;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:11px 20px;border-radius:24px;z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;font-family:'Noto Sans JP',sans-serif;}
.toast.show{opacity:1;}
.empty{text-align:center;padding:60px 20px;color:#AAA;font-size:14px;}
</style>
</head>
<body>

<div class="top-bar">
  <h1>内装状況管理</h1>
  <p id="today-date"></p>
  <div style="display:flex;gap:7px;margin-top:9px;">
    <a href="/vac-BZx4Zk5tRqn2vhii" style="flex:1;text-align:center;text-decoration:none;background:#0E5030;color:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;">📋 空室一覧</a>
    <a href="zaiko.html" style="flex:1;text-align:center;text-decoration:none;background:#15293d;color:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;">🧰 在庫表</a>
    <a href="shiyo_kurume.html" style="flex:1;text-align:center;text-decoration:none;background:#3f7cae;color:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;">📄 工事仕様書</a>
  </div>
</div>

<div class="user-row" id="user-row"></div>
<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
<div class="cards" id="cards"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-handle-area" onclick="closeModal()"><div class="modal-handle"></div></div>
    <div class="modal-inner">
      <div class="modal-title" id="m-title"></div>
      <div class="modal-sub" id="m-sub"></div>
      <div id="m-body"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzLIY3vZuxl3YqHK4xYpkuStrdD8bMVC9-kkt62G3xZ78hOWH8ypeWhHg-DQo2DyOk5/exec';

const USERS = [
  {id:'owner', name:'圭一さん', label:'オーナー'},
  {id:'moto',  name:'本村さん', label:'内装業者'},
];
const STATUSES = ['内装中','未内装','空予定','完了'];
const BADGE = {'内装中':'b-naiso','未内装':'b-mi','空予定':'b-yotei','完了':'b-done'};
const SCLASS = {'内装中':'s-naiso','未内装':'s-mi','空予定':'s-yotei','完了':'s-done'};

let currentUser = 'owner';
let currentFilter = 'all';
let data = [];
let editingId = null;
let selectedStatus = '';

const _params = new URLSearchParams(location.search);
const _u = _params.get('user');
if(_u && USERS.some(u=>u.id===_u)) currentUser = _u;

const d = new Date();
document.getElementById('today-date').textContent =
  d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});

function isOwner(){ return currentUser==='owner'; }

const CACHE_KEY = 'naiso_cache_v1';
async function loadData(){
  // ① 前回のキャッシュがあれば即表示（GASを待たない＝体感が速い）
  let hadCache = false;
  try {
    const c = localStorage.getItem(CACHE_KEY);
    if (c) { const o = JSON.parse(c); if (Array.isArray(o)) { data = o; render(); hadCache = true; } }
  } catch(e){}
  if (!hadCache) document.getElementById('cards').innerHTML = '<div class="loading"><div class="spin"></div><br>データを読み込み中...</div>';
  // ② 裏で最新を取得して差し替え＋キャッシュ更新
  try {
    const res = await fetch(GAS_URL + '?action=getAll');
    const fresh = await res.json();
    if (Array.isArray(fresh)) {
      data = fresh; render();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(fresh)); } catch(e){}
    }
  } catch(e) {
    if (!hadCache) document.getElementById('cards').innerHTML = '<div class="empty">データの読み込みに失敗しました。<br>再読み込みしてください。</div>';
    // キャッシュ表示中なら、そのまま維持（オフラインでも直近データが見える）
  }
}

async function saveUpdate(params){
  try {
    await fetch(GAS_URL + '?' + new URLSearchParams({action:'update',...params}));
    return true;
  } catch(e){ return false; }
}

function render(){
  renderUsers(); renderSummary(); renderFilters(); renderCards();
}

function renderUsers(){
  document.getElementById('user-row').innerHTML = USERS.map(u=>
    `<button class="ubtn ${currentUser===u.id?'active':''}" onclick="switchUser('${u.id}')">${u.name}（${u.label}）</button>`
  ).join('');
}

function switchUser(id){ currentUser=id; render(); }

function renderSummary(){
  const c={'内装中':0,'未内装':0,'空予定':0,'完了':0};
  data.forEach(p=>{ if(c[p.status]!==undefined) c[p.status]++; });
  document.getElementById('summary').innerHTML = `
    <div class="sbox s-naiso"><div class="sval">${c['内装中']}</div><div class="slbl">内装中</div></div>
    <div class="sbox s-mi"><div class="sval">${c['未内装']}</div><div class="slbl">未内装</div></div>
    <div class="sbox s-yotei"><div class="sval">${c['空予定']}</div><div class="slbl">空予定</div></div>
  `;
}

function renderFilters(){
  const fs=[{id:'all',label:'すべて'},...STATUSES.filter(s=>s!=='完了').map(s=>({id:s,label:s}))];
  document.getElementById('filters').innerHTML = fs.map(f=>
    `<div class="chip ${currentFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.label}</div>`
  ).join('');
}

function setFilter(f){ currentFilter=f; renderFilters(); renderCards(); }

function renderCards(){
  const list = currentFilter==='all' ? data : data.filter(p=>p.status===currentFilter);
  if(!list.length){ document.getElementById('cards').innerHTML='<div class="empty">該当する物件はありません</div>'; return; }

  document.getElementById('cards').innerHTML = list.map(p=>{
    const isContractor = currentUser==='moto';
    const statusBtn = `<button class="abtn ${isContractor?'primary':''}" onclick="openStatus(${p.id})">状況を更新</button>`;
    const editBtn = isOwner() ? `<button class="abtn primary" onclick="openEdit(${p.id})">詳細編集</button>` : '';
    return `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-name">${p.name}</div>
          <div class="card-room">${p.room}号室</div>
        </div>
        <span class="badge ${BADGE[p.status]||'b-yotei'}">${p.status}</span>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="info-lbl">退去日</div><div class="info-val">${p.takyobi||'—'}</div></div>
        <div class="info-item"><div class="info-lbl">管理会社</div><div class="info-val">${p.kanri||'—'}</div></div>
        ${p.kagi?`<div class="info-item"><div class="info-lbl">鍵</div><div class="info-val">${p.kagi}</div></div>`:''}
        ${p.kanryoYotei?`<div class="info-item"><div class="info-lbl">完了予定</div><div class="info-val">${p.kanryoYotei}</div></div>`:''}
        ${p.kojihi&&p.kojihi!=0?`<div class="info-item"><div class="info-lbl">工事費</div><div class="info-val">¥${parseInt(p.kojihi).toLocaleString()}</div></div>`:''}
        ${p.itsukin&&p.itsukin!=0?`<div class="info-item"><div class="info-lbl">違約金等</div><div class="info-val">¥${parseInt(p.itsukin).toLocaleString()}</div></div>`:''}
      </div>
      ${p.notes?`<div class="note-box">${p.notes}</div>`:''}
      <div class="actions">
        ${statusBtn}
        ${editBtn}
      </div>
    </div>`;
  }).join('');
}

function openStatus(id){
  editingId=id;
  const p=data.find(x=>x.id==id);
  selectedStatus=p.status;
  document.getElementById('m-title').textContent=`${p.name} ${p.room}号室`;
  document.getElementById('m-sub').textContent='内装状況を更新';
  document.getElementById('m-body').innerHTML=`
    <div class="fgroup">
      <div class="flabel">内装状況<span class="req">*</span></div>
      <div class="status-grid">
        ${STATUSES.map(s=>`<button class="s-option ${selectedStatus===s?'sel':''}" onclick="selStatus('${s}',this)">${s}</button>`).join('')}
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">完了予定日</div>
      <input class="fval" type="date" id="f-kanryo" value="${p.kanryoYotei||''}">
    </div>
    <div class="fgroup">
      <div class="flabel">備考・メモ</div>
      <textarea class="fval" id="f-notes" placeholder="作業内容、懸念点など">${p.notes||''}</textarea>
    </div>
    <div class="mbtn-row">
      <button class="mbtn" onclick="closeModal()">キャンセル</button>
      <button class="mbtn save" onclick="saveStatus()">保存する</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

function selStatus(s, el){
  selectedStatus=s;
  document.querySelectorAll('.s-option').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}

async function saveStatus(){
  const p=data.find(x=>x.id==editingId);
  const kanryo=document.getElementById('f-kanryo').value;
  const notes=document.getElementById('f-notes').value;
  p.status=selectedStatus; p.kanryoYotei=kanryo; p.notes=notes;
  closeModal(); render(); try{localStorage.setItem(CACHE_KEY,JSON.stringify(data));}catch(e){}
  showToast('保存中...');
  await saveUpdate({id:editingId, status:selectedStatus, kanryoYotei:kanryo, notes:notes});
  showToast('更新しました ✓');
}

function openEdit(id){
  editingId=id;
  const p=data.find(x=>x.id==id);
  document.getElementById('m-title').textContent=`${p.name} ${p.room}号室`;
  document.getElementById('m-sub').textContent='詳細情報を編集';
  document.getElementById('m-body').innerHTML=`
    <div class="fgroup">
      <div class="flabel">工事費（円）</div>
      <input class="fval" type="number" id="f-kojihi" value="${p.kojihi||0}">
    </div>
    <div class="fgroup">
      <div class="flabel">違約金・清掃代（円）</div>
      <input class="fval" type="number" id="f-itsukin" value="${p.itsukin||0}">
    </div>
    <div class="fgroup">
      <div class="flabel">鍵所在</div>
      <input class="fval" type="text" id="f-kagi" value="${p.kagi||''}">
    </div>
    <div class="fgroup">
      <div class="flabel">備考</div>
      <textarea class="fval" id="f-notes2">${p.notes||''}</textarea>
    </div>
    <div class="mbtn-row">
      <button class="mbtn" onclick="closeModal()">キャンセル</button>
      <button class="mbtn save" onclick="saveEdit()">保存する</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

async function saveEdit(){
  const p=data.find(x=>x.id==editingId);
  const kojihi=document.getElementById('f-kojihi').value;
  const itsukin=document.getElementById('f-itsukin').value;
  const kagi=document.getElementById('f-kagi').value;
  const notes=document.getElementById('f-notes2').value;
  p.kojihi=kojihi; p.itsukin=itsukin; p.kagi=kagi; p.notes=notes;
  closeModal(); render(); try{localStorage.setItem(CACHE_KEY,JSON.stringify(data));}catch(e){}
  showToast('保存中...');
  await saveUpdate({id:editingId, kojihi, itsukin, kagi, notes});
  showToast('保存しました ✓');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('overlay')) closeModal();
});

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'), 2000);
}

loadData();
</script>
</body>
</html>
