<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>資金繰り帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FAF4E4; --surface:#FFFFFF; --surface-2:#FBF6EA; --ink:#26200F; --muted:#8C7C54;
  --hair:#ECE1C6; --accent:#B07D06; --accent-soft:#B07D0618;
  --corp:#2A4E8F; --corp-soft:#2A4E8F16;
  --crit:#C7362E; --crit-bg:#C7362E14; --warn:#B4740B; --warn-bg:#B4740B14; --good:#2E7D4F; --good-bg:#2E7D4F12;
  --shadow:0 1px 2px rgba(120,95,20,.06),0 4px 16px rgba(120,95,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130A; --surface:#221D11; --surface-2:#1B1710; --ink:#EFE7D2; --muted:#A99A76;
  --hair:#37311F; --accent:#E3B647; --accent-soft:#E3B64722; --corp:#7B9CE6; --corp-soft:#7B9CE622;
  --crit:#F0685E; --crit-bg:#F0685E1c; --warn:#E5A63B; --warn-bg:#E5A63B1c; --good:#5FC98A; --good-bg:#5FC98A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#17130A; --surface:#221D11; --surface-2:#1B1710; --ink:#EFE7D2; --muted:#A99A76;
  --hair:#37311F; --accent:#E3B647; --accent-soft:#E3B64722; --corp:#7B9CE6; --corp-soft:#7B9CE622;
  --crit:#F0685E; --crit-bg:#F0685E1c; --warn:#E5A63B; --warn-bg:#E5A63B1c; --good:#5FC98A; --good-bg:#5FC98A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
.num{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.wrap{max-width:940px;margin:0 auto;padding:12px 16px 26px;}
[hidden]{display:none!important;}
header.top{background:var(--bg);padding-top:8px;margin-bottom:6px;}
.acctbar{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;}
.acctbar .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.syncstat{white-space:nowrap;}
.logoutbtn{font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:6px 11px;cursor:pointer;white-space:nowrap;}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px;}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:.01em;}
.head-right{display:flex;align-items:center;gap:9px;}
.asof{font-size:13.5px;color:var(--muted);}
.editbtn{font-family:inherit;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:20px;padding:7px 15px;cursor:pointer;white-space:nowrap;}
.editbtn.on{background:var(--accent);color:#fff;}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:55;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:none;border-radius:28px;padding:15px 24px;cursor:pointer;box-shadow:0 4px 18px rgba(14,124,107,.45);-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.fab.on{background:var(--crit);box-shadow:0 4px 18px rgba(199,54,46,.45);}
.kpis{display:grid;grid-template-columns:1fr;gap:8px;}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:15px;padding:13px 17px;box-shadow:var(--shadow);}
.kpi .lab{font-size:13.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-bottom:2px;}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.015em;line-height:1.02;}
.kpi .sub{font-size:13.5px;color:var(--muted);margin-top:3px;}
.group{margin-top:10px;}
.ghead{position:sticky;top:0;z-index:6;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hair);border-left:4px solid var(--accent);border-radius:15px;padding:13px 16px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;text-align:left;color:inherit;}
.g-corp .ghead{border-left-color:var(--corp);}
.g-corp .gh-lab{color:var(--corp);}
.g-corp .gh-hint{color:var(--corp);background:var(--corp-soft);}
.g-corp>.gbody .row:not(.row-crit){border-left-color:var(--corp);border-left-width:5px;}
.g-corp>.gbody .row .stripe.st-good{background:var(--corp);}
.g-ind>.gbody .row:not(.row-crit){border-left-color:var(--accent);border-left-width:5px;}
.ghead.has-crit{border-color:var(--crit);border-left-width:5px;}
.gh-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;}
.gh-lab{font-size:14px;font-weight:800;color:var(--accent);letter-spacing:.04em;}
.gh-cnt{color:var(--muted);font-weight:500;font-size:13px;}
.gh-badge{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:20px;}
.gh-badge.crit{background:var(--crit);color:#fff;}
.gh-badge.warn{background:var(--warn-bg);color:var(--warn);}
.gh-sub{font-size:13px;color:var(--muted);}
.gh-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;}
.gh-hint{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:4px 11px;white-space:nowrap;}
.gh-bal{font-size:22px;font-weight:800;letter-spacing:-.015em;}
.gh-caret{font-size:11px;color:var(--muted);transition:transform .18s;}
.ghead[aria-expanded="true"] .gh-caret{transform:rotate(180deg);}
.gbody{margin-top:8px;}
.rows{display:flex;flex-direction:column;gap:7px;}
.row{background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
.row.row-crit{border:1.5px solid var(--crit);background:var(--crit-bg);}
.row.row-crit .bankname{color:var(--crit);}
.rhead{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:12px 14px 12px 0;cursor:pointer;}
.row.nopay .rhead,body.editing .rhead{cursor:default;}
.stripe{width:4px;align-self:stretch;margin:-12px 0;}
.st-crit{background:var(--crit)} .st-warn{background:var(--warn)} .st-good{background:var(--good)} .st-neu{background:var(--hair)}
.bankcell{min-width:0;}
.bankname{font-weight:500;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.acct{font-size:13px;color:var(--muted);}
.pct{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.pct b{font-weight:700;color:var(--ink);}
.pct .pos{color:var(--good);font-weight:700;} .pct .neg{color:var(--crit);font-weight:700;}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:0;text-align:right;}
.right .lab{font-size:11px;color:var(--muted);letter-spacing:.03em;}
.right.pay{justify-content:center;opacity:.9;}
.right.pay .big{font-size:14.5px;font-weight:500;color:var(--muted);}
.right.bal .big{font-size:23px;font-weight:800;line-height:1.02;letter-spacing:-.01em;}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.diff{font-size:13px;margin-top:1px;}
.diff.pos{color:var(--good)} .diff.neg{color:var(--crit)}
.caret{transition:transform .18s;color:var(--muted);font-size:11px;}
.row.open .caret{transform:rotate(90deg);}
.detail{display:none;border-top:1px solid var(--hair);background:var(--surface-2);padding:8px 14px 12px 18px;}
.row.open .detail{display:block;}
.note{font-size:13px;color:var(--ink);white-space:pre-wrap;line-height:1.55;}
.yen::before{content:"¥";opacity:.55;font-weight:400;margin-right:1px;}
.inp{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;border:1.5px solid var(--accent);border-radius:9px;padding:7px 9px;background:var(--surface);color:var(--ink);width:100%;max-width:150px;text-align:right;-webkit-appearance:none;}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px;}
.inp.small{font-size:13px;max-width:120px;font-weight:500;}
.right.bal .inp{max-width:130px;}
.txt{font-family:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--accent);border-radius:9px;padding:7px 9px;background:var(--surface);color:var(--ink);width:100%;}
.txt.small{font-size:12.5px;font-weight:400;}
.efield{display:flex;flex-direction:column;gap:3px;margin:6px 0;}
.efield label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em;}
.erow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.editcard{padding:12px 14px 14px;}
.editcard .head-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;}
.grp-pill{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:3px 10px;}
.del{font-family:inherit;font-size:12px;font-weight:700;color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit);border-radius:9px;padding:6px 11px;cursor:pointer;}
.del.armed{background:var(--crit);color:#fff;}
.addbtn{width:100%;font-family:inherit;font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:12px;padding:13px;cursor:pointer;margin-top:8px;}
.photorow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:8px 0 2px;border-top:1px dashed var(--hair);margin-top:8px;}
.thumb{position:relative;width:58px;height:58px;}
.thumb img{width:58px;height:58px;object-fit:cover;display:block;border-radius:9px;border:1px solid var(--hair);cursor:pointer;background:var(--surface-2);}
.thx{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;border:none;background:var(--crit);color:#fff;font-size:11px;cursor:pointer;padding:0;}
.photobtn{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px dashed var(--accent);border-radius:9px;padding:9px 13px;cursor:pointer;}
.pchip{font-family:inherit;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--hair);border-radius:20px;padding:2px 9px;cursor:pointer;display:inline-flex;gap:4px;align-items:center;}
.cardframe{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:13px 17px;box-shadow:var(--shadow);margin-top:12px;}
.cf-title{font-size:14px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;}
.cf-rows{display:flex;flex-direction:column;gap:8px;}
.cf-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.cf-row .cf-lab{font-size:13.5px;color:var(--muted);line-height:1.4;}
.cf-num{font-size:18px;font-weight:800;white-space:nowrap;}
.cf-diff{border-top:1.5px solid var(--hair);padding-top:9px;margin-top:1px;}
.cf-diff .cf-lab{font-weight:700;color:var(--ink);font-size:14px;}
.cf-num.pos{color:var(--good);} .cf-num.neg{color:var(--crit);}
.empty{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;margin-top:12px;}
.empty h2{font-size:17px;margin:0 0 6px;}
.empty p{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.6;}
.empty .row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.pbtn{font-family:inherit;font-size:14px;font-weight:800;border-radius:11px;padding:11px 18px;cursor:pointer;border:1.5px solid var(--accent);}
.pbtn.primary{background:var(--accent);color:#fff;} .pbtn.ghost{background:var(--surface);color:var(--accent);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);}
.tbtn{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:8px 13px;cursor:pointer;}
.tbtn:hover{color:var(--ink);}
.savehint{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted);line-height:1.7;}
.foot b{color:var(--ink);}
.kpi-link{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:11px;padding:11px 0 0;border:none;border-top:1px solid var(--hair);background:none;font-family:inherit;cursor:pointer;text-align:left;}
.kl-lab{font-size:13px;font-weight:700;color:var(--ink);}
.kl-hint{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:4px 11px;white-space:nowrap;flex:none;}
.kl-hint .tw{font-size:10px;transition:transform .18s;}
.kpi-link[aria-expanded="true"] .kl-hint .tw{transform:rotate(180deg);}
.loanframe{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow);margin-top:8px;}
.lf-title{font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.lf-title::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);}
.lf-banks{display:flex;flex-direction:column;}
.lbank{padding:9px 0;border-top:1px solid var(--hair);}
.lbank:first-child{border-top:0;padding-top:2px;}
.lbank .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.lbank .bn{font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.btag{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--hair);border-radius:20px;padding:1px 7px;}
.lbank .df{font-size:15px;font-weight:800;white-space:nowrap;}
.lbank .df.pos{color:var(--good);} .lbank .df.neg{color:var(--crit);}
.lbank .r2{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
.lbank .r2 b{color:var(--ink);font-weight:600;}
.lf-total{border-top:2px solid var(--accent);margin-top:3px;padding-top:9px;}
.lf-total .bn{color:var(--accent);}
.sec-h{display:flex;align-items:center;gap:9px;margin:14px 2px 8px;}
.sec-h .bar{width:3px;height:16px;border-radius:2px;background:var(--muted);}
.sec-h h2{font-size:13px;font-weight:700;margin:0;letter-spacing:.04em;color:var(--muted);}
.tsumi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;}
.tcard{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:9px 12px;box-shadow:var(--shadow);position:relative;}
.tcard .tb{font-size:14px;font-weight:500;}
.tcard .tv{font-size:16.5px;font-weight:700;margin-top:2px;}
.tcard .tm{font-size:12.5px;color:var(--muted);}
.calcbtn{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:9px 12px;cursor:pointer;margin-top:6px;width:100%;}
.calcres{font-size:13px;font-weight:700;margin-top:10px;padding:9px 11px;background:var(--accent-soft);border-radius:8px;line-height:1.7;color:var(--ink);}
.pov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:22px;}
.pov img{max-width:100%;max-height:76vh;border-radius:10px;object-fit:contain;}
.pov-close{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer;}
.pov-nav{display:flex;gap:16px;align-items:center;}
.pov-nav button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:20px;padding:9px 17px;font-size:14px;cursor:pointer;font-family:inherit;}
.pov-cnt{color:#fff;font-size:13px;opacity:.85;}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px;}
.mcard{background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:460px;padding:18px;}
.mtitle{font-size:16px;font-weight:800;margin-bottom:8px;}
.mnote{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 12px;}
.mnote b{color:var(--ink);}
.mta{width:100%;height:150px;font-family:"Roboto Mono",monospace;font-size:11px;border:1.5px solid var(--hair);border-radius:10px;padding:10px;background:var(--surface-2);color:var(--ink);resize:vertical;}
.mmsg{font-size:12px;font-weight:700;margin-top:8px;min-height:16px;}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;}
/* login gate */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.gcard{background:var(--surface);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:28px 24px;text-align:center;}
.gcard h1{font-size:22px;margin:6px 0 4px;}
.gcard .gsub{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.6;}
.gcard label{display:block;text-align:left;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.gcard input{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--hair);border-radius:11px;padding:12px 13px;background:var(--surface);color:var(--ink);}
.gcard input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
.gbtn{width:100%;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:none;border-radius:11px;padding:13px;cursor:pointer;margin-top:14px;}
.gbtn:disabled{opacity:.5;cursor:default;}
.glink{display:block;width:100%;margin-top:12px;background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;}
.glink:hover{color:var(--accent);}
.gmsg{font-size:13px;margin-top:14px;line-height:1.6;min-height:18px;}
.gmsg.ok{color:var(--good);font-weight:700;} .gmsg.err{color:var(--crit);font-weight:700;}
.gnote{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.6;border-top:1px solid var(--hair);padding-top:14px;text-align:left;}
.gnote b{color:var(--ink);}
.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}
#editBanner{position:sticky;top:0;z-index:40;background:var(--accent);color:#fff;text-align:center;font-size:13px;font-weight:800;padding:10px 12px;letter-spacing:.02em;box-shadow:0 2px 10px rgba(14,124,107,.28);}
body.editing{background:var(--accent-soft);}
body.editing .wrap{outline:2px solid var(--accent);outline-offset:-2px;border-radius:2px;}
body.editing .editbtn.on{box-shadow:0 2px 10px rgba(14,124,107,.4);}
@media(max-width:560px){h1{font-size:18px;} .right.bal .big{font-size:19px;} .inp{max-width:118px;font-size:15px;} .erow{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="boot" id="bootScreen">読み込み中…</div>
<div id="editBanner" hidden>✏️ 編集モードです — 数字を入力したら、右上の「✓ 完了」を押してください</div>

<div class="gate" id="authGate" hidden>
  <div class="gcard">
    <div style="font-size:32px">🏦</div>

      m.innerHTML='<div class="mcard"><div class="mtitle">バックアップを読み込む</div>'
        +'<p class="mnote">書き出したバックアップの文字を下に貼り付けて「読み込む」を押してください。<br><b>今入っている内容は置き換わります。</b></p>'
        +'<textarea class="mta" id="mImport" placeholder="ここにバックアップを貼り付け"></textarea>'
        +'<div class="mmsg" id="mMsg"></div>'
        +'<div class="mbtns"><button class="pbtn primary" id="mDoImport">読み込む</button><button class="pbtn ghost" data-mclose>閉じる</button></div></div>';
      m.removeAttribute('hidden');$('mImport').focus();
    }
  }
  function setMMsg(txt,err){const m=$('mMsg');if(m){m.textContent=txt;m.style.color=err?'var(--crit)':'var(--good)';}}
  function doImport(){
    const t=$('mImport').value.trim();if(!t){setMMsg('バックアップの文字を貼り付けてください。',true);return;}
    let obj;try{obj=JSON.parse(t);}catch(e){setMMsg('うまく読み取れませんでした。全文が貼れているか確認してください。',true);return;}
    const st=(obj&&obj.state&&obj.state.accounts)?obj.state:((obj&&obj.accounts)?obj:null);
    if(!st){setMMsg('資金繰り帳のバックアップではないようです。',true);return;}
    state=st;normalizeState();save();$('backupModal').setAttribute('hidden','');render();
  }

  // ---------- ローン電卓 ----------
  let calcResult=null;
  function openCalc(id){
    const a=acctById(id);if(!a)return;calcId=id;calcResult=null;
    const L=a.loan||{};const m=$('backupModal');
    m.innerHTML='<div class="mcard"><div class="mtitle">🧮 返済の自動計算</div>'
      +'<p class="mnote">返済予定表や契約書を見ながら<b>借入額・年利・返済年数</b>を入れてください。毎月返済額と現在の借入残高を計算して、この口座に反映します。</p>'
      +'<div class="efield"><label>借入額（円）</label><input class="inp" id="cLoan" inputmode="numeric" value="'+(L.amount||'')+'" style="max-width:none" placeholder="例）50000000"></div>'
      +'<div class="erow"><div class="efield"><label>年利（％）</label><input class="inp" id="cRate" inputmode="decimal" value="'+(L.rate!=null&&L.rate!==''?L.rate:'')+'" style="max-width:none" placeholder="例）2.5"></div>'
      +'<div class="efield"><label>返済年数（年）</label><input class="inp" id="cYears" inputmode="numeric" value="'+(L.years||'')+'" style="max-width:none" placeholder="例）30"></div></div>'
      +'<div class="efield"><label>返済スタートからの経過月数（任意・残高計算用）</label><input class="inp" id="cElapsed" inputmode="numeric" value="'+(L.elapsed||'')+'" style="max-width:none;text-align:right" placeholder="例）12（1年経過）"></div>'
      +'<div class="calcres" id="cRes">借入額・年利・返済年数を入れると結果が出ます。</div>'
      +'<div class="mbtns"><button class="pbtn primary" id="cApply">この口座に反映</button><button class="pbtn ghost" data-mclose>閉じる</button></div></div>';
    m.removeAttribute('hidden');calcPreview();$('cLoan').focus();
  }
  function calcPreview(){
    const P=pnum($('cLoan').value),rate=pfloat($('cRate').value),years=pfloat($('cYears').value),el=pnum($('cElapsed').value);
    calcResult=calcLoan(P,rate,years,el);const box=$('cRes');if(!box)return;
    if(!calcResult){box.innerHTML='借入額・年利・返済年数を入れると結果が出ます。';return;}
    box.innerHTML='毎月返済額 <b class="num yen">'+yen(calcResult.pay)+'</b><br>現在の借入残高 <b class="num yen">'+yen(calcResult.bal)+'</b> '
      +(el>0?'<span style="font-weight:400;color:var(--muted)">（残り約'+(calcResult.remaining/12).toFixed(1)+'年）</span>':'<span style="font-weight:400;color:var(--muted)">（経過月数を入れると残高が減ります）</span>');
  }
  function applyCalc(){
    const a=acctById(calcId);if(!a||!calcResult)return;
    a.pay=calcResult.pay;a.borrow=calcResult.bal;
    a.loan={amount:pnum($('cLoan').value),rate:pfloat($('cRate').value),years:pfloat($('cYears').value),elapsed:pnum($('cElapsed').value)};
    save();$('backupModal').setAttribute('hidden','');render();
  }

  // ---------- events ----------
  document.addEventListener('click',ev=>{
    const t=ev.target;let e;
    if(t.closest('#fabEdit')){editing=!editing;if(editing){gexp['法人']=true;gexp['個人']=true;}document.body.classList.toggle('editing',editing);render();return;}
    if(t.id==='logoutBtn'){doLogout();return;}
    if(e=t.closest('[data-del]')){const id=e.getAttribute('data-del');const acc=acctById(id),ts=tsumiById(id);if(!acc&&!ts)return;
      if(armedDel===id){if(armedTimer)clearTimeout(armedTimer);armedDel=null;
        if(acc){state.accounts=state.accounts.filter(x=>x.id!==id);}
        else{state.tsumi=state.tsumi.filter(x=>x.id!==id);}
        save();render();}
      else{armDel(id);render();}
      return;}
    if(armedDel){armedDel=null;if(armedTimer)clearTimeout(armedTimer);if(editing&&document.querySelector('.del.armed'))render();}
    if(e=t.closest('[data-add]')){const g=e.getAttribute('data-add');const a={grp:g,id:uid(),bank:'',branch:'',acct:'',bal:0,pay:0,borrow:0,note:'',photos:[]};state.accounts.push(a);if(!editing){editing=true;gexp['法人']=true;gexp['個人']=true;document.body.classList.add('editing');}save();render();const inp=document.querySelector('.f-bank[data-id="'+a.id+'"]');if(inp)inp.focus();return;}
    if(e=t.closest('[data-addt]')){const g=e.getAttribute('data-addt');const t2={grp:g,id:uid(),bank:'',bal:0,mo:0};state.tsumi.push(t2);save();render();const inp=document.querySelector('.tf-bank[data-tid="'+t2.id+'"]');if(inp)inp.focus();return;}
    if(e=t.closest('[data-calc]')){openCalc(e.getAttribute('data-calc'));return;}
    if(t.id==='cApply'){applyCalc();return;}
    if(e=t.closest('#lfToggle')){lfOpen=!lfOpen;render();return;}
    if(t.id==='seedBtn'){seed();return;}
    if(t.id==='exportBtn'){openBackup('export');return;}
    if(t.id==='importBtn'){openBackup('import');return;}
    if(t.id==='mCopy'){const ta=$('mExport');if(ta){ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value);ok=true;}}catch(e){}setMMsg(ok?'✓ コピーしました。':'上の文字を長押し→全選択してコピーしてください。',!ok);}return;}
    if(t.id==='mDoImport'){doImport();return;}
    if(t.closest('[data-mclose]')||t.id==='backupModal'){$('backupModal').setAttribute('hidden','');return;}
    if(e=t.closest('.ghead')){const g=e.getAttribute('data-g');gexp[g]=!gexp[g];render();return;}
    if(e=t.closest('.rhead')){if(editing)return;if(t.closest('input')||t.closest('button'))return;const row=e.closest('.row');if(row&&row.querySelector('.detail'))row.classList.toggle('open');return;}
  });
  document.addEventListener('input',ev=>{
    const t=ev.target;if(!t.classList)return;const id=t.getAttribute('data-id');const a=id?acctById(id):null;
    const tid=t.getAttribute('data-tid');const ts=tid?tsumiById(tid):null;
    if(t.classList.contains('f-bank')&&a){a.bank=t.value;save();return;}
    if(t.classList.contains('f-branch')&&a){a.branch=t.value;save();return;}
    if(t.classList.contains('f-acct')&&a){a.acct=t.value;save();return;}
    if(t.classList.contains('f-note')&&a){a.note=t.value;save();return;}
    if(t.classList.contains('tf-bank')&&ts){ts.bank=t.value;save();return;}
    if(t.id==='asofInp'){state.asof=t.value;save();return;}
    if(t.id==='cLoan'||t.id==='cRate'||t.id==='cYears'||t.id==='cElapsed'){calcPreview();return;}
  });
  document.addEventListener('change',ev=>{
    const t=ev.target;if(!t.classList&&t.id!=='cardOn')return;const id=t.getAttribute&&t.getAttribute('data-id');const a=id?acctById(id):null;
    const tid=t.getAttribute&&t.getAttribute('data-tid');const ts=tid?tsumiById(tid):null;
    if(t.classList.contains('f-bal')&&a){a.bal=pnum(t.value);save();render();return;}
    if(t.classList.contains('f-pay')&&a){a.pay=pnum(t.value);save();render();return;}
    if(t.classList.contains('f-borrow')&&a){a.borrow=pnum(t.value);save();render();return;}
    if(t.classList.contains('tf-bal')&&ts){ts.bal=pnum(t.value);save();render();return;}
    if(t.classList.contains('tf-mo')&&ts){ts.mo=pnum(t.value);save();render();return;}
    if(t.id==='cardOn'){state.card.on=t.checked;save();render();return;}
    if(t.id==='cardPay'){state.card.pay=pnum(t.value);save();return;}
    if(t.id==='cardAcct'){state.card.acctId=t.value||null;save();return;}
  });

  function seed(){
    state={v:1,asof:'（サンプル）',card:{on:true,pay:180000,acctId:null},tsumi:[
      {grp:'法人',id:uid(),bank:'A銀行 積金',bal:800000,mo:50000},
      {grp:'個人',id:uid(),bank:'C銀行 積金',bal:240000,mo:20000}
    ],accounts:[
      {grp:'法人',id:uid(),bank:'A銀行',branch:'本店',acct:'1234567',bal:3200000,pay:850000,borrow:96000000,note:'物件① 500,000 / 物件② 350,000',photos:[]},
      {grp:'法人',id:uid(),bank:'B信用金庫',branch:'〇〇支店',acct:'2345678',bal:180000,pay:250000,borrow:0,note:'',photos:[]},
      {grp:'個人',id:uid(),bank:'C銀行',branch:'△△支店',acct:'3456789',bal:1500000,pay:300000,borrow:38000000,note:'自宅ローン',photos:[]}
    ]};
    state.card.acctId=state.accounts[2].id;
    save();render();
  }

  // ---------- auth ----------
  function showGate(){
    $('bootScreen').setAttribute('hidden','');$('appWrap').setAttribute('hidden','');
    const eb=$('editBanner');if(eb)eb.hidden=true;
    $('authGate').removeAttribute('hidden');
    $('loginSection').removeAttribute('hidden');$('recoverySection').setAttribute('hidden','');
    const asb=$('authSend');if(asb)asb.disabled=false;const apw=$('authPass');if(apw)apw.value='';
    // 太田塾ハブ（同一ドメイン）でログイン済みのメールを自動入力
    try{const hubEmail=localStorage.getItem('otajuku_email');
      if(hubEmail&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(hubEmail)&&!$('authEmail').value){
        $('authEmail').value=hubEmail;
        const m=$('authMsg');m.className='gmsg';m.innerHTML='太田塾に登録のメールを入れておきました。<b>パスワードを決めて「はじめる」</b>を押してください。';
      }
    }catch(e){}
  }
  function authEmailVal(){return ($('authEmail').value||'').trim();}
  async function doAuth(){
    const email=authEmailVal();const password=$('authPass').value||'';const msg=$('authMsg');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.className='gmsg err';msg.textContent='メールアドレスを正しく入力してください。';return;}
    if(password.length<6){msg.className='gmsg err';msg.textContent='パスワードは6文字以上にしてください。';return;}
    $('authSend').disabled=true;msg.className='gmsg';msg.textContent='確認中…';
    try{
      // 既存ユーザーはログイン
      const si=await sb.auth.signInWithPassword({email,password});
      if(!si.error){msg.className='gmsg ok';msg.textContent='✓ ログインしました。';return;}
      // 失敗＝新規の可能性→登録を試す
      const su=await sb.auth.signUp({email,password});
      if(su.error){
        msg.className='gmsg err';
        msg.textContent=/registered|exist/i.test(su.error.message||'')?'このメールは登録済みです。パスワードが違います。':('エラー：'+(su.error.message||'もう一度お試しください'));
      } else if(su.data&&su.data.session){
        msg.className='gmsg ok';msg.textContent='✓ アカウントを作成してログインしました。';
      } else {
        msg.className='gmsg ok';msg.innerHTML='✉️ 確認メールを送りました。メール内のリンクをタップすると使えます。';
      }
    }catch(e){msg.className='gmsg err';msg.textContent='エラー：'+((e&&e.message)||'もう一度お試しください');}
    $('authSend').disabled=false;
  }
  async function forgotPassword(){
    const email=authEmailVal();const msg=$('authMsg');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.className='gmsg err';msg.textContent='先にメールアドレスを入力してください。';return;}
    msg.className='gmsg';msg.textContent='メール送信中…';
    try{
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error)throw error;
      msg.className='gmsg ok';msg.innerHTML='✉️ '+esc(email)+' にパスワード再設定用メールを送りました。<br>メール内のリンクをタップすると、新しいパスワードを決められます（迷惑メールもご確認を）。';
    }catch(e){msg.className='gmsg err';msg.textContent='送信に失敗しました：'+((e&&e.message)||'もう一度');}
  }
  function showRecovery(){
    $('bootScreen').setAttribute('hidden','');$('appWrap').setAttribute('hidden','');$('authGate').removeAttribute('hidden');
    $('loginSection').setAttribute('hidden','');$('recoverySection').removeAttribute('hidden');
    const m=$('authMsg');m.className='gmsg';m.textContent='新しいパスワードを決めて「変更する」を押してください。';
    const np=$('newPass');if(np){np.value='';np.focus();}
  }
  async function setNewPassword(){
    const pw=$('newPass').value||'';const msg=$('authMsg');
    if(pw.length<6){msg.className='gmsg err';msg.textContent='パスワードは6文字以上にしてください。';return;}
    $('authSetPass').disabled=true;msg.className='gmsg';msg.textContent='変更中…';
    try{
      const {error}=await sb.auth.updateUser({password:pw});
      if(error)throw error;
      recoveryMode=false;try{history.replaceState(null,'',location.pathname);}catch(_){}
      $('loginSection').removeAttribute('hidden');$('recoverySection').setAttribute('hidden','');
      msg.className='gmsg ok';msg.textContent='✓ パスワードを変更しました。';
      const {data}=await sb.auth.getSession();
      if(data&&data.session)enterApp(data.session);
    }catch(e){msg.className='gmsg err';msg.textContent='変更に失敗：'+((e&&e.message)||'もう一度');$('authSetPass').disabled=false;}
  }
  async function doLogout(){try{await sb.auth.signOut();}catch(e){}}
  async function enterApp(session){
    CURRENT_UID=session.user.id;
    $('acctEmail').textContent=session.user.email||'';
    $('authGate').setAttribute('hidden','');$('bootScreen').setAttribute('hidden','');$('appWrap').removeAttribute('hidden');
    setSync('読み込み中…');
    const cloud=await cloudLoad();
    if(cloud===undefined){const c=readCache();state=(c&&c.accounts)?c:defaultState();setSync('⚠️ オフライン（この端末に保存）');}
    else if(cloud&&cloud.accounts){state=cloud;setSync('☁️ 同期済み');}
    else{state=defaultState();setSync('☁️ 同期済み');normalizeState();await cloudSaveNow();}
    normalizeState();
    editing=false;document.body.classList.remove('editing');
    render();
  }

  function boot(){
    if(!window.supabase){$('bootScreen').textContent='読み込みに失敗しました。通信環境をご確認のうえ、ページを再読み込みしてください。';return;}
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    if(/type=recovery/.test(location.hash||''))recoveryMode=true;
    $('authSend').addEventListener('click',doAuth);
    $('authEmail').addEventListener('keydown',e=>{if(e.key==='Enter')$('authPass').focus();});
    $('authPass').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
    $('authForgot').addEventListener('click',forgotPassword);
    $('authSetPass').addEventListener('click',setNewPassword);
    $('newPass').addEventListener('keydown',e=>{if(e.key==='Enter')setNewPassword();});
    sb.auth.getSession().then(({data})=>{
      if(recoveryMode){showRecovery();return;}
      if(data&&data.session){enterApp(data.session);}else{showGate();}
    }).catch(()=>showGate());
    sb.auth.onAuthStateChange((event,session)=>{
      if(event==='PASSWORD_RECOVERY'){recoveryMode=true;showRecovery();return;}
      if(recoveryMode)return;
      if((event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED')&&session&&CURRENT_UID!==session.user.id){enterApp(session);}
      else if(event==='SIGNED_OUT'){CURRENT_UID=null;state=defaultState();showGate();$('authMsg').textContent='';$('authEmail').value='';}
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body>
