<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>令和8年 太田塾 年間イベント一覧</title>
  <script>(function(){var G="https://script.google.com/macros/s/AKfycbyZAnDfRVkEsGmaEmZoXQixgMyVHmlMJ-6aMQ4M7Pr_8_q8NwrfAna6tH-eAlYd8uwL/exec";if(localStorage.getItem("otajuku_auth")!=="ok"){location.replace("/");return;}var em=localStorage.getItem("otajuku_email");if(!em){localStorage.removeItem("otajuku_auth");location.replace("/");return;}var ts=parseInt(localStorage.getItem("otajuku_auth_ts")||"0",10);if(Date.now()-ts<86400000){return;}window._rc=function(r){if(r==="ok"){localStorage.setItem("otajuku_auth_ts",""+Date.now());}else{localStorage.removeItem("otajuku_auth");localStorage.removeItem("otajuku_email");localStorage.removeItem("otajuku_auth_ts");location.replace("/");}};var s=document.createElement("script");s.src=G+"?email="+encodeURIComponent(em)+"&callback=_rc";(document.head||document.documentElement).appendChild(s);})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style> body { background: #fefce8; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // 太田塾オンライン用 固定ZOOM（定期・固定期間なし・パスコード埋込・待機室なし＝押すだけ入室）
    const ZOOM_ONLINE = "https://us06web.zoom.us/j/83003669381?pwd=dCNwwLUXT6A1me1V7L79Vodj11IYF2.1";

    const scheduleData = [
      {
        month: "8月",
        events: [
          { date: "4(火)", type: "オンライン", title: "エンパワータイム", location: "", zoom: ZOOM_ONLINE },
        ]
      },
      {
        month: "9月",
        events: [
          { date: "15(火)", type: "オンライン", title: "エンパワータイム(21時〜22時)", location: "", zoom: ZOOM_ONLINE, note: "※今月のみ第3火曜" },
          { date: "17(木)", type: "リアル", title: "第4回 金融機関グループ勉強会", location: "大分銀行" },
          { date: "24(木)", type: "リアル", title: "エンパワータイム(16時〜18時)", location: "天神ワンビルB1", note: "※今月のみ第4木曜" },
          { date: "26(土)", type: "リアル", title: "【仮】檜原新築AP完成見学会", location: "" },
        ]
      },
      {
        month: "10月",
        events: [
          { date: "1(木)", type: "リアル", title: "エンパワータイム(16時〜18時)", location: "天神ワンビルB1", note: "※今月のみ第1木曜" },
          { date: "22(木)", type: "リアル", title: "金融機関祭りVol.3", location: "博多", note: "※会場の都合により15日から変更" },
          { date: "27(火)", type: "オンライン", title: "エンパワータイム(21時〜22時)", location: "", zoom: ZOOM_ONLINE },
        ]
      },
      {
        month: "11月",
        events: [
          { date: "12(木)", type: "リアル", title: "エンパワータイム(16時〜18時)", location: "東京", highlight: true },
          { date: "24(火)", type: "オンライン", title: "エンパワータイム(21時〜22時)", location: "", zoom: ZOOM_ONLINE },
        ]
      },
      {
        month: "12月",
        events: [
          { date: "10(木)〜11(金)", type: "リアル", title: "忘年会", location: "福岡" },
          { date: "22(火)", type: "オンライン", title: "エンパワータイム(21時〜22時)", location: "", zoom: ZOOM_ONLINE },
        ]
      }
    ];

    /* ===== カレンダー表示用のデータ変換 =====
       scheduleDataは編集しやすさ優先で date:"15(火)" / "10(木)〜11(金)" という文字列。
       ここで日付を数値に起こしてカレンダーに置く（複数日イベントは期間中の全日に出す）。 */
    const YEAR = 2026;
    const WD = ['日', '月', '火', '水', '木', '金', '土'];
    /* 令和8年(2026)の祝日。このカレンダーが扱う8〜12月分のみ。
       9/22は敬老の日(21)と秋分の日(23)に挟まれるため「国民の休日」。12月に祝日はない。
       秋分の日は国立天文台の暦要項どおり9/23。 */
    const HOLIDAYS = {
      '8-11': '山の日',
      '9-21': '敬老の日', '9-22': '国民の休日', '9-23': '秋分の日',
      '10-12': 'スポーツの日',
      '11-3': '文化の日', '11-23': '勤労感謝の日'
    };
    /* マス塗りつぶし用の実色（Tailwindのbg-*と同じ色） */
    const EV_HEX = { 'オンライン': '#3b82f6', 'リアル': '#10b981', 'リアル＆オンライン': '#a855f7' };
    const ALL_EVENTS = [];
    scheduleData.forEach(mo => {
      const mm = parseInt(mo.month, 10);
      mo.events.forEach(ev => {
        const s = (ev.date.match(/^(\d+)/) || [])[1];
        if (!s) return;
        const e = (ev.date.match(/〜\s*(\d+)/) || [])[1];
        ALL_EVENTS.push({ ...ev, m: mm, d: parseInt(s, 10), dEnd: e ? parseInt(e, 10) : parseInt(s, 10) });
      });
    });
    const MONTHS = scheduleData.map(mo => parseInt(mo.month, 10));

    // 3ヶ月ごとに分割（行にするため）
    const rows = [];
    for (let i = 0; i < scheduleData.length; i += 3) {
      const chunk = scheduleData.slice(i, i + 3);
      while (chunk.length < 3) {
        chunk.push(null);
      }
      rows.push(chunk);
    }

    const getDotColor = (type) => {
      if (type === 'リアル＆オンライン') return 'bg-purple-500';
      if (type === 'オンライン') return 'bg-blue-500';
      return 'bg-emerald-500';
    };

    /* 1件分の表示（一覧・カレンダー共通）。タイトルは調整さん→ZOOMの順にリンク化する。 */
    function EventLine({ event, showDate }) {
      return (
        <div className="flex items-start gap-1.5">
          <div className="flex-shrink-0 pt-[3px]">
            <div className={`w-2 h-2 rounded-full ${getDotColor(event.type)}`}></div>
          </div>
          <div className="leading-tight flex-1 min-w-0">
            {showDate && (
              <div className="text-[10px] sm:text-[11px] font-bold text-slate-500">{event.date}</div>
            )}
            {event.chousei ? (
              <a href={event.chousei} target="_blank" rel="noopener"
                className="block text-[11px] font-bold text-orange-600 underline decoration-orange-400 decoration-1 underline-offset-2 break-words mt-0.5 tracking-tight">
                {event.title} 📋
              </a>
            ) : event.zoom ? (
              <a href={event.zoom} target="_blank" rel="noopener"
                className="block text-[11px] font-bold text-blue-600 underline decoration-blue-400 decoration-1 underline-offset-2 break-words mt-0.5 tracking-tight">
                {event.title} 🎥
              </a>
            ) : (
              <div className="text-[11px] font-bold text-slate-800 break-words mt-0.5 tracking-tight">{event.title}</div>
            )}
            {event.location && (
              <div className={`mt-0.5 ${event.highlight ? 'text-red-600 font-extrabold text-[10px] sm:text-[11px]' : 'text-[9px] sm:text-[10px] text-slate-400 font-semibold'}`}>
                @{event.location}
              </div>
            )}
            {event.note && (
              <div className="mt-0.5 text-[9px] sm:text-[10px] text-amber-700 font-bold">{event.note}</div>
            )}
          </div>
        </div>
      );
    }

    /* 「エンパワータイムとは？」の説明パネル（ヘッダーのボタンで開閉）。
       会の趣旨＝太田本人の言葉なので、文言は勝手に要約せずそのまま載せる。 */
    const EMPOWER_TOPICS = [
      '購入物件の相談、資料の確認、使い方など',
      '質問',
      '困ってること',
      '活動報告（成果報告、失敗談）',
      '旬なネタ（あれば）小話',
      '不動産以外の話',
      '人生の相談、家族、恋愛（経験薄い笑）',
      'など...'
    ];
    function AboutEmpower({ onClose }) {
      return (
        <div className="mb-4 bg-white rounded-2xl border-2 border-amber-300 shadow-sm p-4 text-left">
          <div className="flex items-start justify-between gap-2 mb-2">
            <div className="text-[13px] font-black text-amber-900">【エンパワータイム】</div>
            <button onClick={onClose} className="text-[11px] font-bold text-amber-700 underline shrink-0">閉じる</button>
          </div>
          <div className="text-[11px] sm:text-[12px] text-slate-700 font-semibold leading-relaxed space-y-2">
            <p>※自分と仲間を勇気づける座談会的なもの。情報交換等</p>
            <p>※エンパワーとは、「力や権限を与える」「力をつける」という意味でみなさんの背中を押す、チャレンジに向かい豊かな人生を創ってもらうという意図でネーミングしました！</p>
            <p>たくさんの質問や不安、悩みがあると思います（不動産に限らず）。<br />そんな困ったことを解決し、前に進むために行動できるようになる機会創りを意図しています。</p>
            <p>特に不動産は<b className="text-amber-800">人と情報が命</b>です。みなさんで最新の情報を共有しながら、チームで前に進みましょう。</p>
            <div className="pt-1">
              <div className="font-black text-amber-900 mb-1">○話の内容（例）</div>
              <ul className="space-y-0.5">
                {EMPOWER_TOPICS.map((t, i) => (
                  <li key={i} className="flex gap-1.5">
                    <span className="text-amber-400">・</span><span>{t}</span>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </div>
      );
    }

    /* カレンダー表示。スマホ1画面に収めるため「月の格子＋その月の予定リスト」の縦2段。
       日付をタップするとその日だけに絞り込み、もう一度タップで解除。 */
    function CalendarView() {
      const now = new Date();
      /* 初期表示は「これから予定がある一番近い月」。今月の予定が全て終わっていれば翌月以降を開く。 */
      const initM = (() => {
        if (now.getFullYear() !== YEAR) return MONTHS[0];
        const cm = now.getMonth() + 1;
        const next = MONTHS.find(mm => mm > cm || (mm === cm && ALL_EVENTS.some(e => e.m === mm && e.dEnd >= now.getDate())));
        return next || MONTHS[MONTHS.length - 1];
      })();
      const [m, setM] = useState(initM);
      const [sel, setSel] = useState(null);
      const idx = MONTHS.indexOf(m);
      const lead = new Date(YEAR, m - 1, 1).getDay();
      const last = new Date(YEAR, m, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(null);
      for (let d = 1; d <= last; d++) cells.push(d);
      while (cells.length % 7) cells.push(null);
      const evOf = (d) => ALL_EVENTS.filter(e => e.m === m && d >= e.d && d <= e.dEnd);
      const monthEvents = ALL_EVENTS.filter(e => e.m === m).sort((a, b) => a.d - b.d);
      const shown = sel ? evOf(sel) : monthEvents;
      const go = (step) => { const n = MONTHS[idx + step]; if (n) { setM(n); setSel(null); } };
      const isToday = (d) => now.getFullYear() === YEAR && now.getMonth() + 1 === m && now.getDate() === d;

      return (
        <div>
          <div className="flex items-center justify-between mb-2">
            <button onClick={() => go(-1)} disabled={idx === 0}
              className={`w-8 h-8 rounded-full font-black text-lg ${idx === 0 ? 'text-amber-200' : 'text-amber-700 hover:bg-amber-100'}`}>‹</button>
            <div className="font-black text-amber-900 text-base">{YEAR}年 {m}月</div>
            <button onClick={() => go(1)} disabled={idx === MONTHS.length - 1}
              className={`w-8 h-8 rounded-full font-black text-lg ${idx === MONTHS.length - 1 ? 'text-amber-200' : 'text-amber-700 hover:bg-amber-100'}`}>›</button>
          </div>

          <div className="grid grid-cols-7 gap-px bg-amber-100 rounded-xl overflow-hidden border border-amber-100">
            {WD.map((w, i) => (
              <div key={w} className={`bg-amber-50 text-center text-[10px] font-black py-1 ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-amber-800'}`}>{w}</div>
            ))}
            {cells.map((d, i) => {
              if (!d) return <div key={i} className="bg-white/40 h-10"></div>;
              const evs = evOf(d);
              const on = sel === d;
              const hol = HOLIDAYS[m + '-' + d];
              /* 予定がある日はマスごと色で塗りつぶす（点だと小さくて見落とすため 2026-08-08）。
                 種別が2つ以上ある日は斜めの2色分割にする。 */
              const cols = [...new Set(evs.map(e => EV_HEX[e.type] || EV_HEX['リアル']))];
              const fill = !cols.length ? null
                : cols.length === 1 ? cols[0]
                : `linear-gradient(135deg, ${cols[0]} 0 50%, ${cols[1]} 50% 100%)`;
              const dow = i % 7;
              const numColor = fill ? 'text-white'
                : (hol || dow === 0) ? 'text-red-500' : dow === 6 ? 'text-blue-500' : 'text-slate-700';
              return (
                <button key={i} title={hol || ''} onClick={() => setSel(on ? null : (evs.length ? d : null))}
                  style={fill ? { background: fill } : undefined}
                  className={`h-10 flex items-center justify-center ${fill ? '' : 'bg-white'} ${on ? 'ring-2 ring-amber-900 ring-inset' : ''} ${isToday(d) ? 'ring-2 ring-amber-500 ring-inset' : ''} ${evs.length ? 'cursor-pointer' : 'cursor-default'}`}>
                  <span className={`text-[12px] font-black leading-none ${numColor}`}>{d}</span>
                </button>
              );
            })}
          </div>

          <div className="mt-3">
            <div className="flex items-center justify-between mb-1.5">
              <div className="text-[11px] font-black text-amber-900">
                {sel ? `${m}月${sel}日の予定` : `${m}月の予定（${monthEvents.length}件）`}
              </div>
              {sel && (
                <button onClick={() => setSel(null)} className="text-[10px] font-bold text-amber-700 underline">月全体に戻す</button>
              )}
            </div>
            <div className="bg-white rounded-2xl border border-amber-100 shadow-sm p-3 space-y-2.5 min-h-[64px]">
              {shown.length ? shown.map((e, i) => <EventLine key={i} event={e} showDate={true} />)
                : <div className="text-[11px] text-slate-400 font-bold">予定はありません</div>}
            </div>
          </div>
        </div>
      );
    }

    function ScheduleRoadmap() {
      const hasChousei = scheduleData.some(m => m.events.some(e => e.chousei));
      const hasZoom = scheduleData.some(m => m.events.some(e => e.zoom));
      /* 表示モード（カレンダー／一覧）。選んだ方を次回も開くよう端末に覚えさせる。 */
      const [view, setView] = useState(localStorage.getItem('otajuku_sched_view') || 'calendar');
      const [help, setHelp] = useState(false);
      const pick = (v) => { setView(v); try { localStorage.setItem('otajuku_sched_view', v); } catch (e) {} };
      const tab = (v) => `flex-1 py-1.5 rounded-full text-[12px] font-black transition-colors ${view === v ? 'bg-amber-500 text-white shadow-sm' : 'text-amber-800'}`;
      return (
        <div className="min-h-screen bg-amber-50/50 p-2 sm:p-4 font-sans text-slate-800 flex flex-col items-center">
          <div className="w-full max-w-lg mb-3">
            <a href="/" className="text-amber-800 text-xs font-bold no-underline">‹ メニューに戻る</a>
          </div>

          <div id="roadmap-container" className="w-full max-w-lg bg-yellow-50 p-3 sm:p-5 rounded-3xl shadow-xl border border-white relative">
            {/* スマホ1画面に収めたいので、ヘッダーは小さめ・余白は詰めている */}
            <div className="mb-3 sm:mb-5 text-center">
              <h1 className="text-[0.95rem] sm:text-2xl font-black text-amber-900 flex items-center justify-center gap-1.5 mb-2 tracking-tight whitespace-nowrap">
                <span className="text-lg sm:text-3xl drop-shadow-sm">🌻</span>
                <span>令和８年太田塾年間イベント一覧</span>
                <span className="text-lg sm:text-3xl drop-shadow-sm">🌻</span>
              </h1>
              <div className="flex flex-wrap justify-center gap-2.5 sm:gap-4 text-[10px] sm:text-xs font-bold bg-white px-3 py-1 rounded-full shadow-sm border border-amber-200 mx-auto w-fit">
                <div className="flex items-center gap-1 text-blue-600">
                  <div className="w-2.5 h-2.5 rounded-full bg-blue-500"></div>
                  <span>オンライン</span>
                </div>
                <div className="flex items-center gap-1 text-emerald-600">
                  <div className="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                  <span>リアル</span>
                </div>
                <div className="flex items-center gap-1 text-purple-600">
                  <div className="w-2.5 h-2.5 rounded-full bg-purple-500"></div>
                  <span>リアル＆オンライン</span>
                </div>
              </div>
              <div className="mt-2 mx-auto w-fit max-w-full text-left text-[10px] sm:text-[11px] font-bold text-amber-900 leading-snug">
                <div>○第２木曜日　リアルエンパワータイム（３ヶ月に一度東京目安）</div>
                <div>○第４火曜日　オンラインエンパワータイム</div>
              </div>
              {/* ヒントと「エンパワータイムとは？」は横1行に並べて、スマホ1画面の高さを崩さない */}
              <div className="mt-2 flex flex-wrap justify-center items-center gap-1.5">
                {(hasChousei || hasZoom) && (
                  <div className="bg-orange-50 border border-orange-200 text-orange-700 text-[10px] sm:text-[11px] font-bold px-3 py-1 rounded-full leading-snug">
                    {hasChousei && <span>📋 は<span className="underline decoration-orange-400">タイトルをタップ</span>で参加表明（調整さん）</span>}
                    {hasChousei && hasZoom && <span> / </span>}
                    {hasZoom && <span>🎥 は<span className="underline decoration-blue-400">タップ</span>でZOOM入室</span>}
                  </div>
                )}
                <button onClick={() => setHelp(!help)}
                  className="bg-amber-500 text-white text-[10px] sm:text-[11px] font-black px-3 py-1 rounded-full shadow-sm hover:bg-amber-600 transition-colors">
                  ❓ エンパワータイムとは？ {help ? '▲' : '▼'}
                </button>
              </div>
            </div>

            {help && <AboutEmpower onClose={() => setHelp(false)} />}

            {/* 表示切替（LINEオープンチャットのように カレンダー⇄一覧） */}
            <div className="flex gap-1 bg-amber-100/70 p-1 rounded-full mb-3">
              <button onClick={() => pick('calendar')} className={tab('calendar')}>📅 カレンダー</button>
              <button onClick={() => pick('list')} className={tab('list')}>📋 一覧</button>
            </div>

            {view === 'calendar' && <CalendarView />}

            <div className={`space-y-8 sm:space-y-10 ${view === 'calendar' ? 'hidden' : ''}`}>
              {rows.map((row, rowIdx) => {
                const validItemCount = row.filter(Boolean).length;
                const rightPos = validItemCount === 3 ? 'right-[15%]' : 'right-[48%]';
                return (
                  <div key={rowIdx} className="relative flex justify-between gap-1.5 sm:gap-3">
                    <div className={`absolute top-[18px] left-[15%] ${rightPos} h-0.5 border-t-[3px] border-dashed border-amber-300/80 z-0`}></div>
                    {row.map((data, colIdx) => {
                      if (!data) {
                        return <div key={colIdx} className="flex-1 opacity-0 pointer-events-none"></div>;
                      }
                      return (
                        <div key={colIdx} className="flex-1 relative z-10 flex flex-col">
                          <div className="mx-auto bg-amber-500 text-white w-10 h-10 sm:w-11 sm:h-11 rounded-full flex items-center justify-center font-black text-sm sm:text-base border-[3px] border-white shadow-sm z-20 relative">
                            <span>{data.month.replace('月', '')}</span><span className="text-[10px] sm:text-xs ml-0.5">月</span>
                          </div>
                          <div className="bg-white rounded-2xl shadow-sm border border-amber-100 p-2 sm:p-3 pt-6 sm:pt-7 -mt-5 flex-1 z-10 relative">
                            <div className="space-y-2.5">
                              {data.events.map((event, eIdx) => (
                                <EventLine key={eIdx} event={event} showDate={true} />
                              ))}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ScheduleRoadmap />);
  </script>
</body>
</html>
