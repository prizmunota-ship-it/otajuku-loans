<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>令和8年 太田塾 年間スケジュール</title>
<script>(function(){var G="https://script.google.com/macros/s/AKfycbyZAnDfRVkEsGmaEmZoXQixgMyVHmlMJ-6aMQ4M7Pr_8_q8NwrfAna6tH-eAlYd8uwL/exec";if(localStorage.getItem("otajuku_auth")!=="ok"){location.replace("/");return;}var em=localStorage.getItem("otajuku_email");if(!em){localStorage.removeItem("otajuku_auth");location.replace("/");return;}var ts=parseInt(localStorage.getItem("otajuku_auth_ts")||"0",10);if(Date.now()-ts<86400000){return;}window._rc=function(r){if(r==="ok"){localStorage.setItem("otajuku_auth_ts",""+Date.now());}else{localStorage.removeItem("otajuku_auth");localStorage.removeItem("otajuku_email");localStorage.removeItem("otajuku_auth_ts");location.replace("/");}};var s=document.createElement("script");s.src=G+"?email="+encodeURIComponent(em)+"&callback=_rc";(document.head||document.documentElement).appendChild(s);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:linear-gradient(160deg,#FFFBEA 0%,#FFF3B0 55%,#FFE566 100%);min-height:100vh;color:#1C1400;}
.wrap{max-width:560px;margin:0 auto;padding:0 0 40px;}
header{background:linear-gradient(135deg,#F5C400 0%,#D4920A 60%,#C47800 100%);padding:18px 16px 14px;position:sticky;top:0;z-index:100;box-shadow:0 3px 16px rgba(180,110,0,.35);}
.back{display:inline-block;color:#fff;font-size:12px;font-weight:700;text-decoration:none;opacity:.95;margin-bottom:8px;}
header h1{color:#fff;font-size:18px;font-weight:900;letter-spacing:.02em;}
header .sub{color:#FFF3C4;font-size:11px;margin-top:3px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;background:#FFF8E1;border-bottom:1.5px solid #EDD97A;padding:9px 16px;font-size:11px;font-weight:700;}
.legend .lg{display:flex;align-items:center;gap:5px;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.d-online{background:#3B82F6;} .d-real{background:#10B981;} .d-both{background:#A855F7;}
.legend .l-online{color:#2563EB;} .legend .l-real{color:#059669;} .legend .l-both{color:#9333EA;}
.body{padding:12px 14px;}
.month{background:#fff;border:1.5px solid rgba(245,196,0,.4);border-radius:14px;margin-bottom:11px;overflow:hidden;box-shadow:0 4px 14px rgba(180,130,0,.08);}
.m-head{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#FFE9A8,#FFD866);padding:9px 15px;}
.m-badge{background:#D4920A;color:#fff;font-weight:900;font-size:13px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(180,110,0,.3);}
.m-badge small{font-size:8px;margin-left:1px;}
.m-name{font-size:13px;font-weight:800;color:#8A5A00;}
.evs{padding:6px 14px 10px;}
.ev{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed #F0DFA0;}
.ev:last-child{border-bottom:none;}
.ev .dot{margin-top:5px;}
.ev .ec{flex:1;min-width:0;}
.ev .edate{font-size:11px;font-weight:700;color:#8A7020;}
.ev .etitle{font-size:12.5px;font-weight:700;color:#2A2008;line-height:1.4;margin-top:1px;word-break:break-word;}
.ev .eloc{font-size:10.5px;color:#A0863A;margin-top:1px;}
.foot{text-align:center;font-size:10px;color:#A89050;margin-top:14px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="back" href="/">‹ メニューに戻る</a>
  <h1>🌻 令和8年 太田塾 年間スケジュール</h1>
  <div class="sub">下半期（7月〜12月）の予定</div>
</header>
<div class="legend">
  <div class="lg l-online"><span class="dot d-online"></span>オンライン</div>
  <div class="lg l-real"><span class="dot d-real"></span>リアル</div>
  <div class="lg l-both"><span class="dot d-both"></span>リアル＆オンライン</div>
</div>
<div class="body" id="body"></div>
<div class="foot">© 太田塾 メンバー専用<br>最新情報に随時更新されます</div>
</div>
<script>
var scheduleData = [
  {month:"7月", events:[
    {date:"7(火)", type:"オンライン", title:"エンパワータイム", location:""},
    {date:"9(木)", type:"リアル", title:"第3回 金融機関グループ勉強会(融資編)", location:"福岡中央銀行西新支店"},
    {date:"23(木)", type:"リアル", title:"エンパワータイム", location:"天神ワンビルB1"}
  ]},
  {month:"8月", events:[
    {date:"2(日)", type:"リアル", title:"BBQ", location:"福岡糸島"},
    {date:"4(火)", type:"オンライン", title:"エンパワータイム", location:""},
    {date:"27(木)", type:"リアル", title:"エンパワータイム", location:"天神ワンビルB1"}
  ]},
  {month:"9月", events:[
    {date:"1(火)", type:"オンライン", title:"エンパワータイム", location:""},
    {date:"17(木)", type:"リアル", title:"第4回 金融機関グループ勉強会", location:"大分銀行"},
    {date:"24(木)", type:"リアル", title:"エンパワータイム", location:"天神ワンビルB1"},
    {date:"26(土)", type:"リアル", title:"【仮】檜原新築AP完成見学会", location:""}
  ]},
  {month:"10月", events:[
    {date:"6(火)", type:"オンライン", title:"エンパワータイム", location:""},
    {date:"15(木)", type:"リアル", title:"金融機関祭りVol.3", location:"博多"},
    {date:"22(木)", type:"リアル", title:"エンパワータイム", location:"天神ワンビルB1"}
  ]},
  {month:"11月", events:[
    {date:"10(火)", type:"オンライン", title:"エンパワータイム", location:""},
    {date:"26(木)", type:"リアル", title:"エンパワータイム", location:"天神ワンビルB1"}
  ]},
  {month:"12月", events:[
    {date:"1(火)", type:"オンライン", title:"エンパワータイム", location:""},
    {date:"10(木)〜11(金)", type:"リアル", title:"忘年会", location:"福岡"},
    {date:"24(木)", type:"リアル", title:"エンパワータイム", location:"天神ワンビルB1"}
  ]}
];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function dotClass(t){ return t==="リアル＆オンライン"?"d-both":(t==="オンライン"?"d-online":"d-real"); }
var h="";
scheduleData.forEach(function(m){
  var num=m.month.replace("月","");
  h+='<div class="month"><div class="m-head"><span class="m-badge">'+num+'</span><span class="m-name">'+esc(m.month)+'</span></div><div class="evs">';
  m.events.forEach(function(e){
    h+='<div class="ev"><span class="dot '+dotClass(e.type)+'"></span><div class="ec">'+
       '<div class="edate">'+esc(e.date)+'</div><div class="etitle">'+esc(e.title)+'</div>'+
       (e.location?'<div class="eloc">@'+esc(e.location)+'</div>':'')+'</div></div>';
  });
  h+='</div></div>';
});
document.getElementById("body").innerHTML=h;
</script>
</body>
</html>
