<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>久留米倉庫 在庫表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;max-width:100%;}
body{font-family:'Noto Sans JP',sans-serif;background:#F5F4F0;color:#1a1a1a;min-height:100vh;padding-bottom:90px;}

.top-bar{background:#15293d;color:#fff;padding:13px 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.12);}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tb-title{font-size:17px;font-weight:800;letter-spacing:.02em;}
.tb-loc{font-size:11px;color:#aec4dc;margin-top:2px;}
.tb-loc b{color:#fff;}
.links{display:flex;gap:7px;margin-top:11px;}
.lk{flex:1;text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;text-decoration:none;}
.lk:active{background:rgba(255,255,255,.25);}

.summary{display:flex;gap:0;background:#fff;border-bottom:1px solid #E8E6E0;}
.sbox{flex:1;padding:9px 0;text-align:center;border-right:1px solid #EEE;}
.sbox:last-child{border-right:none;}
.sbox .n{font-size:18px;font-weight:800;color:#15293d;}
.sbox .n.warn{color:#c0392b;}
.sbox .l{font-size:10px;color:#888;margin-top:1px;}

.searchwrap{padding:10px 14px 4px;}
.search{width:100%;padding:10px 14px;border:1.5px solid #DDD;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
.search:focus{border-color:#15293d;}

.wrap{padding:6px 14px 0;}
.cat{margin-top:14px;}
.cat-h{font-size:12px;font-weight:800;color:#15293d;letter-spacing:.04em;padding:4px 2px 7px;display:flex;align-items:center;gap:7px;}
.cat-h .bar{width:4px;height:14px;background:#3f7cae;border-radius:2px;}
.cat-h .cnt{margin-left:auto;font-size:10px;color:#999;font-weight:600;}

.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E8E6E0;border-radius:13px;padding:11px 12px;margin-bottom:8px;}
.item.low{border-color:#e8b4ad;background:#fdf6f5;}
.item .info{flex:1;min-width:0;}
.item .nm{font-size:14px;font-weight:700;line-height:1.35;word-break:break-word;}
.item .meta{font-size:10.5px;color:#999;margin-top:2px;}
.item .meta .req{color:#c0392b;font-weight:700;}
.stepper{display:flex;align-items:center;gap:0;flex-shrink:0;}
.stepper button{width:34px;height:34px;border:1.5px solid #CBD5DF;background:#fff;color:#15293d;font-size:20px;font-weight:700;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.stepper button:active{background:#eef3f8;}
.stepper button.minus{color:#c0392b;border-color:#e0b0aa;}
.stepper .qty{width:46px;text-align:center;font-size:18px;font-weight:800;border:none;background:none;font-family:inherit;color:#15293d;-moz-appearance:textfield;}
.stepper .qty::-webkit-outer-spin-button,.stepper .qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.empty{text-align:center;color:#aaa;padding:30px;font-size:13px;}

.fab{position:fixed;right:18px;bottom:78px;width:54px;height:54px;border-radius:50%;background:#15293d;color:#fff;border:none;font-size:28px;box-shadow:0 4px 16px rgba(21,41,61,.4);cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;}

.footbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E8E6E0;padding:9px 14px;display:flex;align-items:center;gap:8px;z-index:150;}
.footbar .upd{flex:1;font-size:10.5px;color:#999;}
.fbtn{background:#F0F2F5;border:1px solid #DDE3EA;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:700;color:#15293d;font-family:inherit;cursor:pointer;text-decoration:none;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:8px 18px 30px;}
.mh{text-align:center;padding:8px 0 6px;}
.mh .bar{width:36px;height:4px;background:#DDD;border-radius:2px;display:inline-block;}
.mt{font-size:16px;font-weight:800;text-align:center;margin:2px 0 16px;color:#15293d;}
.fld{margin-bottom:13px;}
.fld label{display:block;font-size:11px;color:#888;font-weight:700;margin-bottom:5px;}
.fld input,.fld select{width:100%;padding:11px 13px;border:1.5px solid #DDD;border-radius:10px;font-size:15px;font-family:inherit;outline:none;background:#fff;}
.fld input:focus,.fld select:focus{border-color:#15293d;}
.mbtns{display:flex;gap:9px;margin-top:6px;}
.mbtn{flex:1;padding:13px;border-radius:11px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;border:1.5px solid #DDD;background:#F5F4F0;color:#333;}
.mbtn.save{background:#15293d;border-color:#15293d;color:#fff;}
.mbtn.del{flex:0 0 auto;background:#fff;border-color:#e0b0aa;color:#c0392b;padding:13px 16px;}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#15293d;color:#fff;font-size:13px;padding:11px 20px;border-radius:24px;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="tb-row">
    <div>
      <div class="tb-title">🧰 久留米倉庫 在庫表</div>
      <div class="tb-loc">格納先：<b>プライマリー合川B棟 101号室</b></div>
    </div>
  </div>
  <div class="links">
    <a class="lk" href="shiyo_kurume.html">📄 工事仕様書</a>
    <a class="lk" href="naiso.html">🗂 内装状況表</a>
  </div>
</div>

<div class="summary">
  <div class="sbox"><div class="n" id="s-items">0</div><div class="l">品目数</div></div>
  <div class="sbox"><div class="n" id="s-qty">0</div><div class="l">総在庫数</div></div>
  <div class="sbox"><div class="n warn" id="s-low">0</div><div class="l">要発注</div></div>
</div>

<div class="searchwrap">
  <input class="search" id="search" placeholder="🔍 備品名で検索" oninput="render()">
</div>

<div class="wrap" id="list"></div>

<button class="fab" onclick="openAdd()">＋</button>

<div class="footbar">
  <div class="upd" id="upd">最終更新：—</div>
  <button class="fbtn" onclick="exportJSON()">⬇ バックアップ</button>
  <label class="fbtn" style="cursor:pointer;">⬆ 取込<input type="file" id="imp" accept="application/json" style="display:none;" onchange="importJSON(event)"></label>
</div>

<!-- 編集/追加モーダル -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mh"><span class="bar"></span></div>
    <div class="mt" id="mtitle">備品を追加</div>
    <div class="fld"><label>備品名</label><input id="f-name" placeholder="例）スリッパ（夏用）"></div>
    <div class="fld"><label>カテゴリ</label><select id="f-cat"></select></div>
    <div class="fld" style="display:flex;gap:10px;">
      <div style="flex:1;"><label>在庫数</label><input id="f-qty" type="number" inputmode="numeric" value="0"></div>
      <div style="flex:1;"><label>単位</label><input id="f-unit" placeholder="個"></div>
      <div style="flex:1;"><label>発注点</label><input id="f-reorder" type="number" inputmode="numeric" value="0"></div>
    </div>
    <div class="mbtns">
      <button class="mbtn del" id="delBtn" onclick="delItem()" style="display:none;">削除</button>
      <button class="mbtn" onclick="closeModal()">キャンセル</button>
      <button class="mbtn save" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS_KEY='zaiko_kurume_v2';
const CATS=['6点セット 備品','3点セット 部材','ウェルカムバスケット'];

// 初期在庫（9点セットマニュアル準拠）
const SEED=[
  // 6点セット 備品
  {c:0,n:'スリッパ',u:'組',q:0,r:6},
  {c:0,n:'玄関マット',u:'枚',q:0,r:3},
  {c:0,n:'芳香剤（消臭力 エアリーブーケ）',u:'個',q:0,r:5},
  {c:0,n:'レースカーテン',u:'枚',q:0,r:6},
  {c:0,n:'シーリングライト（LEDリモコン付）',u:'台',q:0,r:3},
  // 3点セット 部材
  {c:1,n:'カーテンレール（白 2m）',u:'本',q:0,r:4},
  {c:1,n:'トイレットペーパーホルダー（棚付）',u:'個',q:0,r:3},
  {c:1,n:'トイレットペーパーホルダー（ダブル）',u:'個',q:0,r:3},
  {c:1,n:'コンセントプレート（6000番台）',u:'枚',q:0,r:5},
  // ウェルカムバスケット中身
  {c:2,n:'ゴミ袋（もえるごみ 大）',u:'袋',q:0,r:5},
  {c:2,n:'バスケット用かご・箱',u:'個',q:0,r:3},
  {c:2,n:'キッチンスポンジ',u:'個',q:0,r:5},
  {c:2,n:'食器洗剤（JOY）',u:'個',q:0,r:3},
  {c:2,n:'お風呂スポンジ',u:'個',q:0,r:3},
  {c:2,n:'お風呂洗剤',u:'個',q:0,r:3},
  {c:2,n:'ハンドソープ',u:'個',q:0,r:3},
  {c:2,n:'除菌クリーナー',u:'個',q:0,r:3},
  {c:2,n:'トイレットペーパー',u:'パック',q:0,r:3},
  {c:2,n:'ティッシュペーパー',u:'箱',q:0,r:3},
];

let data=[];
let editIdx=null;

function load(){
  try{ const s=localStorage.getItem(LS_KEY); if(s){ const o=JSON.parse(s); data=o.items; window._updated=o.updated; return; } }catch(e){}
  data=SEED.map((x,i)=>({id:i+1,cat:x.c,name:x.n,unit:x.u,qty:x.q,reorder:x.r}));
  save(false);
}
function save(stamp=true){
  if(stamp) window._updated=new Date().toISOString();
  localStorage.setItem(LS_KEY, JSON.stringify({items:data,updated:window._updated}));
  renderFoot();
}
function nextId(){ return data.length? Math.max(...data.map(d=>d.id))+1 : 1; }

function render(){
  const q=document.getElementById('search').value.trim();
  const wrap=document.getElementById('list'); wrap.innerHTML='';
  let shownCats=0;
  CATS.forEach((cn,ci)=>{
    let items=data.filter(d=>d.cat===ci);
    if(q) items=items.filter(d=>d.name.includes(q));
    if(!items.length) return;
    shownCats++;
    const sec=document.createElement('div'); sec.className='cat';
    sec.innerHTML=`<div class="cat-h"><span class="bar"></span>${cn}<span class="cnt">${items.length}品目</span></div>`;
    items.forEach(it=>{
      const low = it.qty<=it.reorder;
      const row=document.createElement('div'); row.className='item'+(low?' low':'');
      row.innerHTML=`
        <div class="info" onclick="openEdit(${it.id})">
          <div class="nm">${esc(it.name)}</div>
          <div class="meta">単位:${esc(it.unit||'-')} ／ 発注点:${it.reorder} ${low?'<span class="req">⚠ 要発注</span>':''}</div>
        </div>
        <div class="stepper">
          <button class="minus" onclick="step(${it.id},-1)">−</button>
          <input class="qty" type="number" inputmode="numeric" value="${it.qty}" onchange="setQty(${it.id},this.value)" onclick="this.select()">
          <button onclick="step(${it.id},1)">＋</button>
        </div>`;
      sec.appendChild(row);
    });
    wrap.appendChild(sec);
  });
  if(!shownCats) wrap.innerHTML='<div class="empty">該当する備品がありません</div>';
  renderSummary();
}
function renderSummary(){
  document.getElementById('s-items').textContent=data.length;
  document.getElementById('s-qty').textContent=data.reduce((a,b)=>a+(+b.qty||0),0);
  document.getElementById('s-low').textContent=data.filter(d=>d.qty<=d.reorder).length;
}
function renderFoot(){
  const u=window._updated? new Date(window._updated):null;
  document.getElementById('upd').textContent='最終更新：'+(u? u.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—');
}
function step(id,delta){
  const it=data.find(d=>d.id===id); if(!it) return;
  it.qty=Math.max(0,(+it.qty||0)+delta); save(); render();
}
function setQty(id,v){
  const it=data.find(d=>d.id===id); if(!it) return;
  it.qty=Math.max(0,parseInt(v)||0); save(); render();
}

// モーダル
function fillCatSelect(){
  const sel=document.getElementById('f-cat');
  sel.innerHTML=CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
}
function openAdd(){
  editIdx=null;
  document.getElementById('mtitle').textContent='備品を追加';
  document.getElementById('delBtn').style.display='none';
  document.getElementById('f-name').value='';
  document.getElementById('f-cat').value='0';
  document.getElementById('f-qty').value='0';
  document.getElementById('f-unit').value='個';
  document.getElementById('f-reorder').value='0';
  document.getElementById('overlay').classList.add('show');
}
function openEdit(id){
  const it=data.find(d=>d.id===id); if(!it) return;
  editIdx=id;
  document.getElementById('mtitle').textContent='備品を編集';
  document.getElementById('delBtn').style.display='block';
  document.getElementById('f-name').value=it.name;
  document.getElementById('f-cat').value=it.cat;
  document.getElementById('f-qty').value=it.qty;
  document.getElementById('f-unit').value=it.unit||'';
  document.getElementById('f-reorder').value=it.reorder;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ toast('備品名を入力してください'); return; }
  const o={ name, cat:+document.getElementById('f-cat').value,
    qty:Math.max(0,parseInt(document.getElementById('f-qty').value)||0),
    unit:document.getElementById('f-unit').value.trim()||'個',
    reorder:Math.max(0,parseInt(document.getElementById('f-reorder').value)||0) };
  if(editIdx==null){ data.push({id:nextId(),...o}); toast('追加しました'); }
  else { const it=data.find(d=>d.id===editIdx); Object.assign(it,o); toast('保存しました'); }
  save(); render(); closeModal();
}
function delItem(){
  if(editIdx==null) return;
  if(!confirm('この備品を削除しますか？')) return;
  data=data.filter(d=>d.id!==editIdx); save(); render(); closeModal(); toast('削除しました');
}

function exportJSON(){
  const blob=new Blob([JSON.stringify({items:data,updated:window._updated},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='久留米倉庫_在庫_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(Array.isArray(o.items)){ data=o.items; save(); render(); toast('取り込みました'); } else toast('形式が不正です'); }catch(_){ toast('読み込み失敗'); } };
  rd.readAsText(f); e.target.value='';
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }

// init
fillCatSelect(); load(); render(); renderFoot();
</script>
</body>
</html>
