<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太田塾 物件周辺環境レポート</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBGmP_ru86M2qKEYob0Am5BsHcHbOz8zCI&language=ja&region=JP&callback=_gload" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#1f2937;background:#f1f5f9;font-size:14px;line-height:1.55;}
.wrap{max-width:860px;margin:0 auto;padding:16px 10px 70px;}
.appbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.appbar .lg{font-size:18px;font-weight:800;color:#0f766e;}
.appbar .tg{font-size:11px;color:#6b7280;}
.form{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:14px;}
.mainq label{display:block;font-size:12px;font-weight:800;color:#0f766e;margin-bottom:5px;}
.mainq input{width:100%;padding:13px 14px;border:2px solid #14b8a6;border-radius:10px;font-size:17px;}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;align-items:center;}
.opts label{font-size:13px;font-weight:700;color:#374151;display:flex;align-items:center;gap:5px;}
.opts input[type=checkbox]{width:17px;height:17px;accent-color:#0f766e;}
.opts select{padding:6px 8px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;}
.bigbtn{width:100%;margin-top:12px;background:#0f766e;color:#fff;border:none;border-radius:10px;padding:14px;font-size:17px;font-weight:800;cursor:pointer;}
.bigbtn:disabled{background:#9ca3af;}
.qhint{font-size:11px;color:#6b7280;margin-top:8px;}
.status{display:none;margin:12px 4px;font-size:13px;color:#0f766e;font-weight:700;}
.status.err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:11px 13px;}
.toolbar{display:none;margin-bottom:12px;}
.btn.sec{background:#334155;color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:800;cursor:pointer;}
#report{display:none;}
/* ===== REBC風 1項目=1ペーパー ===== */
.paper{background:#fff;border:1px solid #d7dde3;border-radius:6px;padding:20px 22px 14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);page-break-inside:avoid;}
.paper h2{font-size:17px;font-weight:800;color:#1f2937;border-bottom:2px solid #4b7fb5;padding-bottom:6px;margin-bottom:10px;}
.paper .lead{font-size:12px;color:#374151;margin-bottom:10px;}
.paper .lead b{color:#0f766e;}
.map{width:100%;height:300px;border:1px solid #cbd5e1;border-radius:4px;margin-bottom:12px;background:#eef2f2;position:relative;z-index:0;}
.subttl{font-size:13px;font-weight:800;color:#1f2937;margin:12px 0 5px;padding-left:8px;border-left:4px solid #4b7fb5;}
table.lst{width:100%;border-collapse:collapse;}
table.lst th{background:#eef4fb;border:1px solid #cfd8e3;font-size:11px;padding:6px 8px;font-weight:700;color:#374151;text-align:left;}
table.lst td{border:1px solid #e2e8f0;font-size:12.5px;padding:6px 8px;}
table.lst td.no{width:34px;text-align:center;font-weight:800;color:#fff;}
table.lst td.no span{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;font-size:11px;}
table.lst td.r{text-align:right;white-space:nowrap;font-weight:700;}
table.lst td.nm{font-weight:700;}
.note{font-size:9.5px;color:#94a3b8;margin-top:9px;line-height:1.5;border-top:1px solid #eef2f2;padding-top:6px;}
.gbtn{display:inline-block;margin:2px 0 10px;font-size:11.5px;font-weight:800;color:#0f766e;text-decoration:none;border:1px solid #99f6e4;background:#f0fdfa;padding:6px 12px;border-radius:7px;}
.cover{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:none;}
.cover h1{font-size:22px;font-weight:800;letter-spacing:1px;margin-bottom:4px;}
.cover .cs{font-size:12px;opacity:.9;}
.cover .box{background:rgba(255,255,255,.14);border-radius:8px;padding:12px 14px;margin-top:12px;}
.cover .box .n{font-size:17px;font-weight:800;}
.cover .box .a{font-size:12.5px;margin-top:2px;}
.cover .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;opacity:.95;}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:10.5px;margin:6px 0;}
.legend .c{display:flex;align-items:center;gap:4px;}
.legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid #cbd5e1;display:inline-block;}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px;}
.kpi3 .t{border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;}
.kpi3 .t .l{font-size:10px;color:#6b7280;font-weight:700;}
.kpi3 .t .v{font-size:17px;font-weight:800;color:#0f766e;}
.phase{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:12px;font-size:12px;color:#64748b;}
table.calc{width:100%;border-collapse:collapse;margin-top:4px;}
table.calc td{font-size:12.5px;padding:6px 9px;border:1px solid #e2e8f0;}
table.calc td.r{text-align:right;font-weight:700;}
table.calc td.k{color:#6b7280;}
table.calc tr.sum td{background:#f0fdfa;font-weight:800;}
details.opt{margin-top:12px;border-top:1px dashed #e5e7eb;padding-top:10px;}
details.opt summary{font-size:13px;font-weight:800;color:#0f766e;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 11px;margin-top:9px;}
.fld label{display:block;font-size:10.5px;font-weight:700;color:#6b7280;margin-bottom:2px;}
.fld input,.fld select{width:100%;padding:8px 9px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr;}.kpi3{grid-template-columns:1fr 1fr;}.paper{padding:14px 12px 10px;}}
@media print{
 body{background:#fff;}.appbar,.form,.status,.toolbar{display:none!important;}
 .wrap{padding:0;max-width:none;}
 .paper{page-break-after:always;border:none;box-shadow:none;border-radius:0;margin-bottom:0;}
 .paper:last-child{page-break-after:auto;}
}
</style></head><body>
<div class="wrap">
<div class="appbar"><div class="lg">🌻 太田塾</div><div class="tg">物件周辺環境レポート（金融機関提出用）</div></div>

<div class="form">
  <div class="mainq"><label>物件名 または 住所を入力</label>
  <input id="paddr" placeholder="例：キャナルシティ博多／福岡県筑後市羽犬塚○-○"></div>
  <div class="opts">
    <label>調査範囲
      <select id="pradius"><option value="1000">1,000m</option><option value="1500" selected>1,500m</option><option value="2000">2,000m</option></select>
    </label>
    <label><input type="checkbox" id="opt_edu" checked>教育施設・公園</label>
    <label><input type="checkbox" id="opt_pop">年齢別人口統計</label>
    <label><input type="checkbox" id="opt_haz" checked>ハザードマップ</label>
  </div>
  <button class="bigbtn" id="go" onclick="gen()">📄 レポートを作成</button>
  <div class="qhint">物件名でも住所でもOK（Google検索で位置特定）。教育・人口・ハザードは✓で掲載を選べます。</div>
  <details class="opt"><summary>▶ 収益・積算評価を追加（任意）</summary>
    <div class="grid">
      <div class="fld"><label>構造</label><select id="pstruct"><option value="wood">木造</option><option value="lgs">軽量鉄骨</option><option value="steel">鉄骨</option><option value="rc" selected>RC</option><option value="src">SRC</option></select></div>
      <div class="fld"><label>築年数</label><input id="page" type="number" value="0"></div>
      <div class="fld"><label>満室想定年収入 円</label><input id="pincome" type="number"></div>
      <div class="fld"><label>土地面積 ㎡</label><input id="pland" type="number"></div>
      <div class="fld"><label>建物延床 ㎡</label><input id="pbldg" type="number"></div>
      <div class="fld"><label>土地単価 円/㎡</label><input id="plandprice" type="number"></div>
      <div class="fld"><label>売出価格 円</label><input id="paskprice" type="number"></div>
      <div class="fld"><label>還元利回り %</label><input id="acap" type="number" step="0.1" value="8.0"></div>
    </div>
  </details>
</div>

<div class="status" id="status"></div>
<div class="toolbar" id="toolbar"><button class="btn sec" onclick="window.print()">🖨 PDFで保存 / 印刷</button></div>
<div id="report"></div>
</div>

<script>
/* ============ 共通 ============ */
const STRUCT={wood:{name:"木造",rebuild:150000,useful:22},lgs:{name:"軽量鉄骨造",rebuild:150000,useful:27},steel:{name:"鉄骨造",rebuild:180000,useful:34},rc:{name:"RC",rebuild:200000,useful:47},src:{name:"SRC",rebuild:200000,useful:47}};
const yen=n=>"¥"+Math.round(n).toLocaleString('ja-JP');
const num=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;};
const val=id=>document.getElementById(id).value.trim();
const WALK=80;
function dist(a,b,c,d){const R=6371000,t=Math.PI/180,x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
const wmin=m=>Math.max(1,Math.round(m/WALK));
function setStatus(t,err){const s=document.getElementById('status');s.style.display='block';s.innerHTML=t;s.className='status'+(err?' err':'');}
function hideStatus(){document.getElementById('status').style.display='none';}

let gGeocoder=null; window._gload=function(){try{gGeocoder=new google.maps.Geocoder();}catch(e){}};
function googleGeocode(q){return new Promise(res=>{
  if(!gGeocoder){res(null);return;}
  gGeocoder.geocode({address:q,region:'JP'},(r,s)=>{
    if(s==='OK'&&r&&r[0]){const L=r[0].geometry.location;res({lat:L.lat(),lon:L.lng(),title:r[0].formatted_address.replace(/^日本、?/,''),src:'Google'});}
    else res(null);
  });
});}
async function geocode(q){
  const g=await googleGeocode(q); if(g)return g;
  try{const r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));const j=await r.json();
    if(j&&j.length){const f=j[0];return{lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],title:f.properties.title,src:'GSI'};}}catch(e){}
  return null;
}
async function overpass(lat,lon,radius){
  const q=`[out:json][timeout:50];(
nwr["shop"="convenience"](around:${radius},${lat},${lon});nwr["shop"="supermarket"](around:${radius},${lat},${lon});
nwr["amenity"="pharmacy"](around:${radius},${lat},${lon});nwr["shop"="chemist"](around:${radius},${lat},${lon});
nwr["amenity"="post_office"](around:${radius},${lat},${lon});nwr["amenity"="bank"](around:${radius},${lat},${lon});
nwr["amenity"="hospital"](around:${radius},${lat},${lon});nwr["amenity"="clinic"](around:${radius},${lat},${lon});
nwr["amenity"="dentist"](around:${radius},${lat},${lon});nwr["amenity"="police"](around:${radius},${lat},${lon});
nwr["amenity"="kindergarten"](around:${radius},${lat},${lon});nwr["amenity"="childcare"](around:${radius},${lat},${lon});
nwr["amenity"="school"](around:${radius},${lat},${lon});nwr["leisure"="park"](around:${radius},${lat},${lon});
nwr["amenity"="social_facility"](around:${radius},${lat},${lon});nwr["amenity"="nursing_home"](around:${radius},${lat},${lon});
node["railway"="station"](around:${Math.max(radius,2000)},${lat},${lon});node["highway"="bus_stop"](around:${radius},${lat},${lon});
);out center tags;`;
  const eps=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass.private.coffee/api/interpreter"];
  for(let p=0;p<2;p++)for(const ep of eps){
    try{const c=new AbortController();const t=setTimeout(()=>c.abort(),25000);
      const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q),signal:c.signal});clearTimeout(t);
      if(!r.ok)continue;const j=await r.json();return j.elements||[];}catch(e){}}
  return null;
}
async function jshis(lat,lon){try{const r=await fetch(`https://www.j-shis.bosai.go.jp/map/api/pshm/Y2023/AVR/meshinfo.geojson?position=${lon},${lat}`);if(!r.ok)return null;const j=await r.json();return (j.features&&j.features[0]&&j.features[0].properties)||null;}catch(e){return null;}}

/* ============ 分類 ============ */
function classify(els,lat,lon){
  const L={station:[],bus:[],super:[],conv:[],drug:[],hosp:[],dent:[],post:[],bank:[],police:[],welfare:[],kinder:[],elem:[],jhs:[],hs:[],school:[],park:[]};
  for(const e of (els||[])){
    const t=e.tags||{};const la=e.lat||(e.center&&e.center.lat),lo=e.lon||(e.center&&e.center.lon);
    if(la==null)continue;
    const item={name:t.name||'（名称なし）',lat:la,lon:lo,d:Math.round(dist(lat,lon,la,lo)),op:t.operator||t.network||''};
    item.min=wmin(item.d);
    let k=null;
    if(t.railway==='station')k='station';
    else if(t.highway==='bus_stop')k='bus';
    else if(t.shop==='supermarket')k='super';
    else if(t.shop==='convenience')k='conv';
    else if(t.amenity==='pharmacy'||t.shop==='chemist')k='drug';
    else if(t.amenity==='hospital'||t.amenity==='clinic')k='hosp';
    else if(t.amenity==='dentist')k='dent';
    else if(t.amenity==='post_office')k='post';
    else if(t.amenity==='bank')k='bank';
    else if(t.amenity==='police')k='police';
    else if(t.amenity==='social_facility'||t.amenity==='nursing_home')k='welfare';
    else if(t.amenity==='kindergarten'||t.amenity==='childcare')k='kinder';
    else if(t.amenity==='school'){
      if(/小学校/.test(item.name))k='elem';else if(/中学校/.test(item.name))k='jhs';
      else if(/高校|高等学校/.test(item.name))k='hs';else k='school';}
    else if(t.leisure==='park')k='park';
    if(k)L[k].push(item);
  }
  for(const k in L)L[k].sort((a,b)=>a.d-b.d);
  return L;
}

/* ============ ペーパー描画 ============ */
let MAPS=[];let mapSeq=0;
function mapDiv(){mapSeq++;return {id:'m'+mapSeq,html:`<div class="map" id="m${mapSeq}"></div>`};}
function tbl(items,color,n,extraCol){
  if(!items.length)return `<div class="phase" style="margin:4px 0">この範囲では見つかりませんでした（地図データ未収録の場合あり）</div>`;
  let h=`<table class="lst"><tr><th style="width:34px">No</th><th>名称</th>${extraCol?'<th>'+extraCol.h+'</th>':''}<th style="width:88px;text-align:right">直線距離</th><th style="width:76px;text-align:right">徒歩</th></tr>`;
  items.slice(0,n).forEach((f,i)=>{
    h+=`<tr><td class="no"><span style="background:${color}">${f.idx}</span></td><td class="nm">${f.name}</td>${extraCol?'<td style="font-size:11px;color:#64748b">'+(f.op||'—')+'</td>':''}<td class="r">${f.d.toLocaleString()}m</td><td class="r">約${f.min}分</td></tr>`;});
  return h+'</table>';
}
function paper(title,lead,body,src){
  return `<div class="paper"><h2>${title}</h2><div class="lead">${lead}</div>${body}
  <div class="note">※地図上のアイコンは付近住所に所在することを表すもので、施設の正確な地点を保証するものではありません。距離は直線距離、徒歩は80m/分で算出。<br>※情報出典：${src}</div></div>`;
}
function facilityPaper(title,lead,groups,g,radius,src){
  const m=mapDiv();const markers=[];let body=m.html;let idx=0;
  for(const gr of groups){
    const items=gr.items.slice(0,gr.n);
    items.forEach(f=>{idx++;f.idx=idx;markers.push({lat:f.lat,lon:f.lon,label:idx,color:gr.color,name:f.name});});
    body+=`<div class="subttl">${gr.label}</div>`+tbl(items,gr.color,gr.n,gr.extraCol);
  }
  MAPS.push({id:m.id,center:[g.lat,g.lon],radius,markers});
  return paper(title,lead,body,src);
}
function initMaps(g){
  MAPS.forEach(cfg=>{
    const el=document.getElementById(cfg.id);if(!el)return;
    const map=L.map(cfg.id,{scrollWheelZoom:false,attributionControl:true});
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:'国土地理院',maxZoom:18}).addTo(map);
    L.circle(cfg.center,{radius:cfg.radius,color:'#dc2626',weight:1.5,fill:false,dashArray:'4 4'}).addTo(map);
    L.marker(cfg.center).addTo(map).bindTooltip('調査対象物件',{permanent:false});
    (cfg.overlays||[]).forEach(u=>L.tileLayer(u,{opacity:.65,maxZoom:17}).addTo(map));
    (cfg.markers||[]).forEach(mk=>{
      L.marker([mk.lat,mk.lon],{icon:L.divIcon({className:'',html:`<div style="width:22px;height:22px;border-radius:50%;background:${mk.color};color:#fff;font-size:11px;font-weight:800;text-align:center;line-height:22px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)">${mk.label}</div>`,iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindTooltip(mk.name);
    });
    const b=L.latLng(cfg.center).toBounds(cfg.radius*2.2);map.fitBounds(b);
  });
}

/* ============ メイン ============ */
async function gen(){
  const query=val('paddr');
  if(!query){setStatus('🙏 物件名または住所を入力してください',true);return;}
  document.getElementById('go').disabled=true;
  document.getElementById('report').style.display='none';document.getElementById('toolbar').style.display='none';
  MAPS=[];mapSeq=0;
  setStatus('🔍 「'+query+'」の位置を特定中…（Google）');
  const g=await geocode(query);
  if(!g){setStatus('「'+query+'」が見つかりませんでした🙏 住所（市区町村＋番地）でもう一度お試しください。',true);document.getElementById('go').disabled=false;return;}
  const radius=parseInt(val('pradius'))||1500;
  setStatus('📍 '+g.title+'<br>🛰️ 周辺施設・交通データを取得中…（10〜30秒）');
  const [els,js]=await Promise.all([overpass(g.lat,g.lon,radius),document.getElementById('opt_haz').checked?jshis(g.lat,g.lon):null]);
  if(els===null){setStatus('⚠️ 周辺データの取得が混み合っています。30秒ほど待って、もう一度「レポートを作成」を押してください。',true);document.getElementById('go').disabled=false;return;}
  hideStatus();
  const F=classify(els,g.lat,g.lon);
  const today=new Date();const dstr=today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日';
  const name=query, addr=g.title;
  let h='';

  /* --- 表紙 --- */
  h+=`<div class="paper cover"><h1>物件周辺環境レポート</h1><div class="cs">交通・生活・教育・防災 立地調査資料</div>
    <div class="box"><div class="n">${name}</div><div class="a">📍 ${addr}</div></div>
    <div class="meta"><span>調査対象範囲：${radius.toLocaleString()}m</span><span>発行日：${dstr}</span><span>調査座標：${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}</span><span>太田塾 物件分析</span></div></div>`;

  /* --- 収益・積算（任意） --- */
  const income=num('pincome'),land=num('pland'),bldg=num('pbldg');
  if(income>0||land>0||bldg>0){
    const st=STRUCT[val('pstruct')||'rc'],age=num('page'),lp=num('plandprice'),ask=num('paskprice'),cap=num('acap')||8;
    const noi=income*0.8,sp=cap>0?noi/(cap/100):0;
    const remain=Math.max(st.useful-age,0),bv=st.rebuild*bldg*(st.useful>0?remain/st.useful:0),kp=lp*land+bv;
    let body=`<div class="kpi3"><div class="t"><div class="l">収益価格（還元利回り${cap}%）</div><div class="v">${yen(sp)}</div></div>
      <div class="t"><div class="l">積算価格</div><div class="v">${yen(kp)}</div></div>
      <div class="t"><div class="l">${ask>0?'表面利回り（売出'+yen(ask)+'）':'想定表面利回り'}</div><div class="v">${ask>0?(income/ask*100).toFixed(2):(sp>0?(income/sp*100).toFixed(2):'—')}%</div></div></div>
      <table class="calc">
      <tr><td class="k">満室想定年収入</td><td class="r">${yen(income)}</td><td class="k">運営純収益（経費20%控除）</td><td class="r">${yen(noi)}</td></tr>
      <tr><td class="k">土地評価（${yen(lp)}/㎡×${land}㎡）</td><td class="r">${yen(lp*land)}</td><td class="k">建物評価（${st.name}・残存${remain}/${st.useful}年）</td><td class="r">${yen(bv)}</td></tr>
      <tr class="sum"><td>収益価格</td><td class="r">${yen(sp)}</td><td>積算価格</td><td class="r">${yen(kp)}</td></tr></table>`;
    h+=paper('収益評価・積算評価','入力値に基づく評価試算（収益還元法・積算法）',body,'入力値・一般的評価手法により算出（市場価格を保証するものではありません）');
  }

  /* --- 最寄り駅 --- */
  h+=facilityPaper('最寄り駅情報','調査対象範囲近辺の駅までの距離と徒歩分数（距離順）',
    [{label:'鉄道駅',color:'#2563eb',items:F.station,n:5,extraCol:{h:'路線・事業者'}}],g,radius,'OpenStreetMap');
  /* --- バス停 --- */
  h+=facilityPaper('バス停情報','調査対象範囲近辺のバス停留所（距離順）',
    [{label:'バス停留所',color:'#d97706',items:F.bus,n:6,extraCol:{h:'事業者'}}],g,radius,'OpenStreetMap');
  /* --- ショッピング --- */
  h+=facilityPaper('ショッピング環境','調査対象範囲近辺の買い物施設（距離順）',
    [{label:'スーパー',color:'#16a34a',items:F.super,n:3},{label:'コンビニエンスストア',color:'#0891b2',items:F.conv,n:3},{label:'ドラッグストア・薬局',color:'#db2777',items:F.drug,n:3}],g,radius,'OpenStreetMap');
  /* --- 医療 --- */
  h+=facilityPaper('医療環境','調査対象範囲近辺の医療施設（距離順）',
    [{label:'病院・クリニック',color:'#dc2626',items:F.hosp,n:4},{label:'歯科',color:'#9333ea',items:F.dent,n:3}],g,radius,'OpenStreetMap');
  /* --- 生活・公共 --- */
  h+=facilityPaper('生活・公共施設','調査対象範囲近辺の公共施設・金融機関（距離順）',
    [{label:'郵便局',color:'#dc2626',items:F.post,n:2},{label:'銀行',color:'#0e7490',items:F.bank,n:3},{label:'警察・交番',color:'#334155',items:F.police,n:2}],g,radius,'OpenStreetMap');
  /* --- 福祉 --- */
  h+=facilityPaper('福祉施設','調査対象範囲近辺の福祉施設（距離順）',
    [{label:'福祉施設（介護・支援等）',color:'#7c3aed',items:F.welfare,n:5}],g,radius,'OpenStreetMap');
  /* --- 教育・公園（選択） --- */
  if(document.getElementById('opt_edu').checked){
    h+=facilityPaper('教育施設・公園','調査対象範囲近辺の教育施設と公園（距離順）※ファミリー向け物件の検討資料',
      [{label:'幼稚園・保育所',color:'#f59e0b',items:F.kinder,n:3},{label:'小学校',color:'#16a34a',items:F.elem,n:3},{label:'中学校',color:'#2563eb',items:F.jhs,n:3},{label:'高校',color:'#7c3aed',items:F.hs,n:2},{label:'公園',color:'#059669',items:F.park,n:3}],g,radius,'OpenStreetMap');
  }
  /* --- 人口（選択） --- */
  if(document.getElementById('opt_pop').checked){
    h+=paper('年齢別人口統計','調査対象エリアの人口構成',
      `<div class="phase">📊 年齢別人口統計（国勢調査）は現在データ連携準備中です。<br>次回アップデートで、エリアの人口総数・年齢構成・世帯数を自動掲載予定です。</div>
      <a class="gbtn" href="https://jstatmap.e-stat.go.jp/" target="_blank" rel="noopener">📈 地図で見る統計（jSTAT MAP）で確認 ↗</a>`,'総務省統計局 国勢調査（連携予定）');
  }
  /* --- ハザード（選択） --- */
  if(document.getElementById('opt_haz').checked){
    const m1=mapDiv();MAPS.push({id:m1.id,center:[g.lat,g.lon],radius,markers:[],overlays:['https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png']});
    const m2=mapDiv();MAPS.push({id:m2.id,center:[g.lat,g.lon],radius,markers:[],overlays:['https://disaportaldata.gsi.go.jp/raster/05_dosekiryukeikaikuiki/{z}/{x}/{y}.png','https://disaportaldata.gsi.go.jp/raster/05_kyukeishakeikaikuiki/{z}/{x}/{y}.png','https://disaportaldata.gsi.go.jp/raster/05_jisuberikeikaikuiki/{z}/{x}/{y}.png']});
    let jsRow='';
    if(js){const p=js.T30_I55_PS||js.T30_I60_PS;if(p!=null)jsRow=`<table class="calc" style="margin:8px 0"><tr><td class="k">30年以内に震度6強以上の地震が発生する確率</td><td class="r">${(p*100).toFixed(1)}%（防災科研 J-SHIS）</td></tr></table>`;}
    let body=`<div class="subttl">洪水浸水想定区域（想定最大規模）</div>${m1.html}
      <div class="legend"><span class="c"><span class="sw" style="background:#F7F5A9"></span>0.5m未満</span><span class="c"><span class="sw" style="background:#FFB7B7"></span>0.5〜3m</span><span class="c"><span class="sw" style="background:#FF9191"></span>3〜5m</span><span class="c"><span class="sw" style="background:#F285C9"></span>5〜10m</span><span class="c"><span class="sw" style="background:#DC7ADC"></span>10〜20m</span><span class="c"><span class="sw" style="background:#B40068"></span>20m以上</span></div>
      <div class="subttl">土砂災害警戒区域（土石流・急傾斜地・地すべり）</div>${m2.html}
      <div class="legend"><span class="c"><span class="sw" style="background:#FBD7A3"></span>警戒区域（黄）</span><span class="c"><span class="sw" style="background:#F5B0A0"></span>特別警戒区域（赤）</span><span class="c">色が表示されなければ区域外</span></div>
      ${jsRow}
      <a class="gbtn" href="https://disaportal.gsi.go.jp/maps/?ll=${g.lat},${g.lon}&z=15" target="_blank" rel="noopener">🗾 重ねるハザードマップで詳細確認 ↗</a>`;
    h+=paper('ハザード関連情報','洪水浸水想定・土砂災害警戒区域（国土交通省 ハザードマップポータル公式データ）',body,'国土交通省 ハザードマップポータルサイト／防災科学技術研究所 J-SHIS');
  }

  /* --- Googleマップ確認リンク --- */
  h+=`<div class="paper"><h2>位置の確認（Googleマップ）</h2>
    <iframe style="width:100%;height:300px;border:1px solid #cbd5e1;border-radius:4px" loading="lazy" src="https://maps.google.com/maps?q=${g.lat},${g.lon}&z=16&hl=ja&output=embed"></iframe>
    <a class="gbtn" style="margin-top:8px" href="https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lon}" target="_blank" rel="noopener">📍 Googleマップで開く ↗</a>
    <div class="note">※本レポートは公開データ（Google・国土地理院・OpenStreetMap・国土交通省・防災科研）に基づき太田塾が自動作成したものです。データの正確性・最新性を保証するものではありません。</div></div>`;

  document.getElementById('report').innerHTML=h;
  document.getElementById('report').style.display='block';
  document.getElementById('toolbar').style.display='block';
  setTimeout(()=>initMaps(g),50);
}
</script>
</body></html>
